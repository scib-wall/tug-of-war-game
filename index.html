<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase Changes: Student Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body { 
      font-family: 'Fredoka', sans-serif; 
      text-align: center; 
      color: #ffffff; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0369a1, #312e81);
      background-size: 300% 300%;
      animation: subtleBG 16s ease infinite;
    }

    @keyframes subtleBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 24px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    h1 { font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; }
    
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: white;
      font-size: 1.1rem;
      font-family: 'Fredoka', sans-serif;
      text-align: center;
      outline: none;
    }

    .btn {
      padding: 14px;
      border-radius: 50px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
    }
    .btn:active { transform: scale(0.96); }

    .red-btn { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4); }
    .blue-btn { background: linear-gradient(135deg, #0284c7, #2563eb); box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4); }

    .q-box { font-size: 1.15rem; line-weight: 1.4; font-weight: 600; min-height: 60px; display: flex; align-items: center; justify-content: center; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    button.opt {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 16px 10px;
      border-radius: 18px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button.opt:active:not(:disabled) { transform: scale(0.95); background: rgba(255,255,255,0.25); }

    /* DISABLED / COOL-DOWN BUTTON STATE */
    button.opt:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(80%);
      transform: none !important;
    }

    /* COOL-DOWN WARNING BANNER */
    .cooldown-banner {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: none;
      animation: pulseAlert 0.6s infinite alternate;
    }

    @keyframes pulseAlert {
      from { opacity: 0.7; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }

    /* FLOATING FEEDBACK FX */
    .float-fx {
      position: fixed;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 1000;
    }
    .fx-plus { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.6); }
    .fx-minus { color: #f87171; text-shadow: 0 0 10px rgba(248, 113, 113, 0.6); }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- JOIN CARD -->
  <div class="card" id="joinCard">
    <h1>JOIN THE MATCH</h1>
    <input type="text" id="playerName" placeholder="Enter Your Name" maxlength="15">
    <div style="display: flex; gap: 12px; margin-top: 6px;">
      <button class="btn red-btn" style="flex: 1;" onclick="joinGame('A')">RED TEAM</button>
      <button class="btn blue-btn" style="flex: 1;" onclick="joinGame('B')">BLUE TEAM</button>
    </div>
  </div>

  <!-- GAME PLAY CARD -->
  <div class="card" id="gameCard" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="playerBadge" style="font-weight: 700; opacity: 0.8;"></span>
      <span id="statusBadge" style="font-weight: 800; color: #facc15;">WAITING...</span>
    </div>

    <!-- COOL-DOWN BANNER -->
    <div class="cooldown-banner" id="cooldownBanner">⚠️ SLIPPED! REGAINING FOOTING (3s)...</div>

    <div class="q-box" id="qText">Get Ready!</div>

    <div class="options-grid" id="optionsGrid">
      <button class="opt" disabled>A</button>
      <button class="opt" disabled>B</button>
      <button class="opt" disabled>C</button>
      <button class="opt" disabled>D</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY", 
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com", 
      projectId: "tug-of-war-game-f18b3"
    });
    const db = getDatabase(app);
    const gameRef = ref(db, "game/state");

    const QUESTIONS = {
      A: [
        { q: "Solid to Liquid phase change?", opts: ["Melting", "Freezing", "Sublimation", "Deposition"], answer: "Melting" },
        { q: "Liquid to Gas phase change?", opts: ["Condensation", "Evaporation", "Freezing", "Melting"], answer: "Evaporation" },
        { q: "Solid directly to Gas?", opts: ["Deposition", "Melting", "Sublimation", "Condensation"], answer: "Sublimation" },
        { q: "Gas to Liquid phase change?", opts: ["Freezing", "Condensation", "Evaporation", "Sublimation"], answer: "Condensation" }
      ],
      B: [
        { q: "Liquid to Solid phase change?", opts: ["Freezing", "Melting", "Evaporation", "Sublimation"], answer: "Freezing" },
        { q: "Gas directly to Solid?", opts: ["Sublimation", "Deposition", "Condensation", "Melting"], answer: "Deposition" },
        { q: "Does adding heat increase molecular speed?", opts: ["Yes", "No", "Only in solids", "Never"], answer: "Yes" },
        { q: "Gas to Liquid phase change?", opts: ["Condensation", "Melting", "Freezing", "Evaporation"], answer: "Condensation" }
      ]
    };

    let myName = "", myTeam = "", qIdx = 0, currentStatus = "waiting", isSuddenDeath = false, isCoolingDown = false;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    window.joinGame = function(team) {
      const nameInput = document.getElementById("playerName").value.trim();
      if (!nameInput) return alert("Please enter your name!");

      myName = nameInput; myTeam = team;
      const playerRef = ref(db, `game/presence/${myName}_${Date.now()}`);
      set(playerRef, { name: myName, team: myTeam });
      onDisconnect(playerRef).remove();

      document.getElementById("joinCard").style.display = "none";
      document.getElementById("gameCard").style.display = "flex";
      
      const badge = document.getElementById("playerBadge");
      badge.innerText = `${myName} (${team === 'A' ? 'RED' : 'BLUE'})`;
      badge.style.color = team === 'A' ? '#ff5263' : '#38bdf8';

      listenToGame();
    };

    function listenToGame() {
      onValue(gameRef, (snapshot) => {
        const data = snapshot.val() || {};
        currentStatus = data.status || "waiting";
        isSuddenDeath = (data.timerSecs !== undefined && data.timerSecs <= 30 && data.timerSecs > 0);

        const statusBadge = document.getElementById("statusBadge");

        if (currentStatus === "countdown") {
          statusBadge.innerText = `READY... ${data.countdownVal || ''}`;
          statusBadge.style.color = "#facc15";
          document.getElementById("qText").innerText = "Get Ready!";
          disableButtons(true);
        } else if (currentStatus === "playing") {
          statusBadge.innerText = isSuddenDeath ? "🔥 SUDDEN DEATH 2X!" : "PULL!";
          statusBadge.style.color = isSuddenDeath ? "#ff2a5f" : "#4ade80";
          if (!isCoolingDown) {
            renderQ();
          }
        } else if (currentStatus === "ended") {
          statusBadge.innerText = "MATCH OVER";
          statusBadge.style.color = "#ef4444";
          document.getElementById("qText").innerText = data.winner === myTeam ? "🎉 YOUR TEAM WON!" : (data.winner === "TIE" ? "🤝 IT'S A TIE!" : "💔 MATCH LOST");
          disableButtons(true);
        } else {
          statusBadge.innerText = "WAITING FOR HOST...";
          statusBadge.style.color = "#facc15";
          document.getElementById("qText").innerText = "Waiting for host to start...";
          disableButtons(true);
        }
      });
    }

    function renderQ() {
      if (currentStatus !== "playing" || isCoolingDown) return;
      const q = QUESTIONS[myTeam][qIdx];
      document.getElementById("qText").innerText = q.q;
      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = "";

      q.opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "opt";
        btn.innerText = opt;
        btn.onclick = (e) => handleAnswer(opt, e);
        grid.appendChild(btn);
      });
    }

    function disableButtons(disabled) {
      document.querySelectorAll("button.opt").forEach(b => b.disabled = disabled);
    }

    window.handleAnswer = function(selected, evt) {
      if (currentStatus !== "playing" || isCoolingDown) return;

      const isCorrect = selected === QUESTIONS[myTeam][qIdx].answer;
      
      // Visual Float FX (+5 PTS or SLIPPED!)
      const el = document.createElement("div");
      el.className = `float-fx ${isCorrect ? 'fx-plus' : 'fx-minus'}`;
      el.innerText = isCorrect ? "+5 PTS" : "SLIPPED!";
      el.style.left = `${evt.clientX - 25}px`; 
      el.style.top = `${evt.clientY - 15}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);

      if (isCorrect) {
        playBeep(587.33, "sine", 0.2);
        
        let pullForce = isSuddenDeath ? 30 : 15;
        let pointsAdded = 5;
        const dir = myTeam === "A" ? -1 : 1;

        runTransaction(gameRef, (data) => {
          if (!data || data.status !== "playing") return data;
          let pos = Math.max(-100, Math.min(100, (data.ropePosition || 0) + (pullForce * dir)));
          return { 
            ...data, 
            ropePosition: pos, 
            scoreRed: myTeam === "A" ? (data.scoreRed || 0) + pointsAdded : (data.scoreRed || 0),
            scoreBlue: myTeam === "B" ? (data.scoreBlue || 0) + pointsAdded : (data.scoreBlue || 0) 
          };
        });

        // Rotate to next question immediately
        qIdx = (qIdx + 1) % QUESTIONS[myTeam].length;
        renderQ();

      } else {
        // INCORRECT ANSWER: Trigger 3-Second Cool-down Penalty
        playBeep(130.81, "square", 0.3);
        triggerCooldown(3);
      }
    };

    function triggerCooldown(seconds) {
      isCoolingDown = true;
      const banner = document.getElementById("cooldownBanner");
      disableButtons(true);

      let timeLeft = seconds;
      if (banner) {
        banner.style.display = "block";
        banner.innerText = `⚠️ SLIPPED! REGAINING FOOTING (${timeLeft}s)...`;
      }

      const timer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          if (banner) banner.innerText = `⚠️ SLIPPED! REGAINING FOOTING (${timeLeft}s)...`;
        } else {
          clearInterval(timer);
          isCoolingDown = false;
          if (banner) banner.style.display = "none";
          
          if (currentStatus === "playing") {
            qIdx = (qIdx + 1) % QUESTIONS[myTeam].length;
            renderQ();
          }
        }
      }, 1000);
    }
  </script>
</body>
</html>

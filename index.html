<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tug-of-War Player</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background: #f8fafc; margin: 0; }
    .timer-banner { background: #0f172a; color: #f8fafc; font-size: 1.5rem; font-weight: bold; padding: 12px; border-radius: 12px; max-width: 500px; margin: 0 auto 20px; }
    .card { background: white; padding: 25px; border-radius: 16px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    .card.team-a { border: 4px solid #ef4444; }
    .card.team-b { border: 4px solid #3b82f6; }
    .team-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; color: white; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
    .badge-red { background: #ef4444; }
    .badge-blue { background: #3b82f6; }
    .question { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.opt { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; background: #f8fafc; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
    button.opt:hover { background: #cbd5e1; }
    .end-screen { font-size: 2rem; font-weight: bold; padding: 40px; border-radius: 16px; display: none; }
    .win { background: #dcfce7; color: #166534; }
    .lose { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <!-- TIMER -->
  <div class="timer-banner">⏱️ Time Left: <span id="gameTimer">03:00</span></div>

  <!-- GAME OVER OVERLAY -->
  <div id="endScreen" class="end-screen"></div>

  <!-- QUESTION CARD -->
  <div class="card" id="gameCard">
    <div id="teamBadge" class="team-badge">Assigning Team...</div>
    <div class="question" id="qText">Loading question...</div>
    <div class="options" id="qOptions"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY",
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com",
      projectId: "tug-of-war-game-f18b3",
      storageBucket: "tug-of-war-game-f18b3.firebasestorage.app",
      messagingSenderId: "797664292032",
      appId: "1:797664292032:web:781e254da90da2c43e5125"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameRef = ref(db, "game/state");

    const QUESTIONS = {
      A: [
        { q: "What is 8 × 7?", options: ["54", "56", "62", "48"], answer: "56" },
        { q: "Capital of Japan?", options: ["Seoul", "Beijing", "Tokyo", "Bangkok"], answer: "Tokyo" },
        { q: "Boiling point of water?", options: ["90°C", "100°C", "110°C", "120°C"], answer: "100°C" }
      ],
      B: [
        { q: "What is 9 × 6?", options: ["54", "45", "63", "52"], answer: "54" },
        { q: "Which planet is largest?", options: ["Mars", "Saturn", "Jupiter", "Earth"], answer: "Jupiter" },
        { q: "Primary color?", options: ["Green", "Blue", "Purple", "Orange"], answer: "Blue" }
      ]
    };

    let myTeam = null;
    let qIdx = 0;

    // Auto-balance team assignment
    const presenceRef = ref(db, "game/presence");
    const myPlayerRef = ref(db, `game/presence/${Math.random().toString(36).substring(2, 9)}`);

    runTransaction(presenceRef, (data) => {
      let red = 0, blue = 0;
      if (data) Object.values(data).forEach(p => { if (p.team === "A") red++; else blue++; });
      myTeam = red <= blue ? "A" : "B";
      return data;
    }).then(() => {
      set(myPlayerRef, { team: myTeam });
      onDisconnect(myPlayerRef).remove();
      setupUI();
      renderQ();
    });

    onValue(gameRef, (snapshot) => {
      const data = snapshot.val() || {};
      
      // Timer update
      const t = data.timerSecs !== undefined ? data.timerSecs : 180;
      const m = Math.floor(t / 60).toString().padStart(2, '0');
      const s = (t % 60).toString().padStart(2, '0');
      document.getElementById("gameTimer").innerText = `${m}:${s}`;

      // Check Game Over
      if (data.gameOver) {
        document.getElementById("gameCard").style.display = "none";
        const endScreen = document.getElementById("endScreen");
        endScreen.style.display = "block";

        if (data.winner === myTeam) {
          endScreen.className = "end-screen win";
          endScreen.innerHTML = "🎉 CONGRATULATIONS!<br>YOUR TEAM WON!";
        } else if (data.winner === "TIE") {
          endScreen.className = "end-screen";
          endScreen.innerHTML = "🤝 IT'S A TIE!";
        } else {
          endScreen.className = "end-screen lose";
          endScreen.innerHTML = "💀 GAME OVER!<br>YOUR TEAM LOST!";
        }
      } else {
        document.getElementById("gameCard").style.display = "block";
        document.getElementById("endScreen").style.display = "none";
      }
    });

    window.handleAnswer = function(selected) {
      const isCorrect = selected === QUESTIONS[myTeam][qIdx].answer;
      const pullForce = isCorrect ? 15 : -5;
      const dir = myTeam === "A" ? -1 : 1;

      runTransaction(gameRef, (data) => {
        if (!data || data.gameOver) return data;
        let pos = Math.max(-100, Math.min(100, (data.ropePosition || 0) + (pullForce * dir)));
        return {
          ...data,
          ropePosition: pos,
          scoreRed: isCorrect && myTeam === "A" ? (data.scoreRed || 0) + 1 : (data.scoreRed || 0),
          scoreBlue: isCorrect && myTeam === "B" ? (data.scoreBlue || 0) + 1 : (data.scoreBlue || 0)
        };
      });

      qIdx = (qIdx + 1) % QUESTIONS[myTeam].length;
      renderQ();
    };

    function renderQ() {
      if (!myTeam) return;
      const q = QUESTIONS[myTeam][qIdx];
      document.getElementById("qText").innerText = q.q;
      document.getElementById("qOptions").innerHTML = q.options.map(opt => `
        <button class="opt" onclick="handleAnswer('${opt}')">${opt}</button>
      `).join('');
    }

    function setupUI() {
      const card = document.getElementById("gameCard");
      const badge = document.getElementById("teamBadge");
      if (myTeam === "A") {
        card.className = "card team-a";
        badge.className = "team-badge badge-red";
        badge.innerText = "Team RED";
      } else {
        card.className = "card team-b";
        badge.className = "team-badge badge-blue";
        badge.innerText = "Team BLUE";
      }
    }
  </script>
</body>
</html>

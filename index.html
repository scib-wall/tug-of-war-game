<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase Changes: Tug of War Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body { 
      font-family: 'Fredoka', sans-serif; 
      text-align: center; 
      color: #ffffff; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      overflow-x: hidden;
      position: relative;
      background: linear-gradient(-45deg, #0a1128, #1e1b4b, #0f172a, #172554);
      background-size: 300% 300%;
      animation: bgGlow 12s ease infinite;
    }

    @keyframes bgGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: clamp(20px, 4vw, 36px);
      border-radius: 28px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 900;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .team-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
    .badge-red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 4px 15px rgba(239,68,68,0.4); }
    .badge-blue { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; box-shadow: 0 4px 15px rgba(2,132,199,0.4); }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: #fff;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s ease;
      text-align: center;
    }
    input[type="text"]:focus { border-color: #38bdf8; }

    .team-select-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .team-btn-choice {
      padding: 14px;
      border-radius: 18px;
      border: 2px solid transparent;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.7);
    }
    .team-btn-choice.selected-red {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
      color: #ff8888;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }
    .team-btn-choice.selected-blue {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #7dd3fc;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      border: none;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
    }
    .btn-action:hover { transform: translateY(-2px); }
    .btn-action:active { transform: translateY(0); }

    .question-box {
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.4;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .opt-btn {
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .opt-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(4px); }
    .opt-btn.correct { background: #22c55e !important; border-color: #4ade80 !important; color: #fff; }
    .opt-btn.wrong { background: #ef4444 !important; border-color: #f87171 !important; color: #fff; }

    .status-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.92);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100;
      padding: 20px;
      backdrop-filter: blur(12px);
    }
    .hidden { display: none !important; }

    .streak-pop {
      font-size: 0.95rem;
      font-weight: 800;
      color: #facc15;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- JOIN SCREEN -->
  <div class="card" id="joinScreen">
    <div class="title">Join Game</div>
    <p style="opacity:0.8; font-size:0.9rem; margin-bottom:20px;">Enter your name and pick a team!</p>
    
    <input type="text" id="playerName" placeholder="Enter Your Name" maxlength="16">
    
    <div class="team-select-container">
      <button class="team-btn-choice" id="btnRed" onclick="selectTeam('A')">RED TEAM</button>
      <button class="team-btn-choice" id="btnBlue" onclick="selectTeam('B')">BLUE TEAM</button>
    </div>

    <button class="btn-action" onclick="joinGame()">READY TO PLAY</button>
  </div>

  <!-- GAMEPLAY SCREEN -->
  <div class="card hidden" id="gameScreen">
    <div id="teamBadge" class="team-badge">TEAM</div>
    <div class="question-box" id="questionTxt">Loading Question...</div>
    <div class="options-grid" id="optionsContainer"></div>
    <div class="streak-pop" id="streakTxt">🔥 Streak: 0</div>
  </div>

  <!-- WAITING / GAME END OVERLAY -->
  <div class="status-overlay hidden" id="statusOverlay">
    <h1 id="statusTitle" style="font-family:'Outfit'; font-size:2.5rem; margin-bottom:10px;">GET READY!</h1>
    <p id="statusDesc" style="font-size:1.2rem; opacity:0.9; text-align:center;">Waiting for the host to start...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY", authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com", projectId: "tug-of-war-game-f18b3"
    });
    const db = getDatabase(app);

    // 20 UPDATED QUESTIONS
    const questions = [
      { q: "What is the process when a gas changes into a liquid?", options: ["Melting", "Condensation", "Freezing", "Sublimation"], answer: 1 },
      { q: "What is the process when a solid changes into a liquid?", options: ["Melting", "Freezing", "Evaporation", "Deposition"], answer: 0 },
      { q: "What is the process when a liquid changes into a gas?", options: ["Freezing", "Melting", "Vaporization", "Deposition"], answer: 2 },
      { q: "What is the process when a liquid changes into a solid?", options: ["Melting", "Freezing", "Condensation", "Sublimation"], answer: 1 },
      { q: "What is the process when a solid changes directly into a gas?", options: ["Sublimation", "Melting", "Freezing", "Condensation"], answer: 0 },
      { q: "What is the process when a gas changes directly into a solid?", options: ["Evaporation", "Melting", "Deposition", "Freezing"], answer: 2 },
      { q: "What happens to ice when it is heated?", options: ["It freezes", "It melts", "It deposits", "It condenses"], answer: 1 },
      { q: "What happens to water when it is placed in a freezer?", options: ["It melts", "It evaporates", "It freezes", "It sublimates"], answer: 2 },
      { q: "Water droplets form on the outside of a cold glass because of:", options: ["Melting", "Condensation", "Freezing", "Sublimation"], answer: 1 },
      { q: "Wet clothes dry because water undergoes:", options: ["Evaporation", "Freezing", "Deposition", "Melting"], answer: 0 },
      { q: "Which phase change requires heat?", options: ["Freezing", "Condensation", "Melting", "Deposition"], answer: 2 },
      { q: "Which phase change releases heat?", options: ["Melting", "Evaporation", "Sublimation", "Freezing"], answer: 3 },
      { q: "When water boils, it changes from:", options: ["Solid to liquid", "Liquid to gas", "Gas to liquid", "Solid to gas"], answer: 1 },
      { q: "Frost forming on a cold surface is an example of:", options: ["Deposition", "Melting", "Evaporation", "Vaporization"], answer: 0 },
      { q: "Which state of matter has a fixed shape?", options: ["Gas", "Liquid", "Solid", "Vapor"], answer: 2 },
      { q: "Which state of matter takes the shape of its container but has a fixed volume?", options: ["Solid", "Liquid", "Gas", "Plasma"], answer: 1 },
      { q: "Which state of matter has no fixed shape or volume?", options: ["Solid", "Liquid", "Gas", "Ice"], answer: 2 },
      { q: "Butter becoming liquid when heated is an example of:", options: ["Freezing", "Melting", "Condensation", "Deposition"], answer: 1 },
      { q: "Clouds form when water vapor undergoes:", options: ["Melting", "Freezing", "Condensation", "Sublimation"], answer: 2 },
      { q: "Dry ice changing directly into gas is an example of:", options: ["Freezing", "Condensation", "Sublimation", "Melting"], answer: 2 }
    ];

    let myTeam = null, myName = "", currentQIndex = 0, streak = 0, isAnsweringAllowed = true;
    let playerId = "player_" + Math.random().toString(36).substr(2, 9);

    window.selectTeam = function(team) {
      myTeam = team;
      document.getElementById("btnRed").className = `team-btn-choice ${team === 'A' ? 'selected-red' : ''}`;
      document.getElementById("btnBlue").className = `team-btn-choice ${team === 'B' ? 'selected-blue' : ''}`;
    };

    window.joinGame = function() {
      myName = document.getElementById("playerName").value.trim();
      if (!myName) return alert("Please enter your name!");
      if (!myTeam) return alert("Please choose a team!");

      set(ref(db, `game/presence/${playerId}`), { name: myName, team: myTeam });

      document.getElementById("joinScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
      
      const badge = document.getElementById("teamBadge");
      badge.innerText = myTeam === 'A' ? "TEAM RED" : "TEAM BLUE";
      badge.className = `team-badge ${myTeam === 'A' ? 'badge-red' : 'badge-blue'}`;

      loadNextQuestion();
    };

    function loadNextQuestion() {
      isAnsweringAllowed = true;
      currentQIndex = Math.floor(Math.random() * questions.length);
      const q = questions[currentQIndex];

      document.getElementById("questionTxt").innerText = q.q;
      const optsContainer = document.getElementById("optionsContainer");
      optsContainer.innerHTML = "";

      q.options.forEach((optStr, idx) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerText = `${String.fromCharCode(65 + idx)}. ${optStr}`;
        btn.onclick = () => submitAnswer(idx, btn);
        optsContainer.appendChild(btn);
      });
    }

    function submitAnswer(chosenIndex, btnElement) {
      if (!isAnsweringAllowed) return;
      isAnsweringAllowed = false;

      const q = questions[currentQIndex];
      const isCorrect = chosenIndex === q.answer;

      if (isCorrect) {
        btnElement.classList.add("correct");
        streak++;
        const forceVal = 1 + (streak * 0.2); // Bonus pull power for streak
        
        push(ref(db, "game/pulls"), {
          team: myTeam,
          force: forceVal,
          points: 10,
          timestamp: serverTimestamp()
        });
      } else {
        btnElement.classList.add("wrong");
        streak = 0;
      }

      document.getElementById("streakTxt").innerText = `🔥 Streak: ${streak}`;

      setTimeout(() => {
        loadNextQuestion();
      }, 1000);
    }

    // Sync Game State with Host
    onValue(ref(db, "game/state"), (snapshot) => {
      const state = snapshot.val() || {};
      const overlay = document.getElementById("statusOverlay");
      const title = document.getElementById("statusTitle");
      const desc = document.getElementById("statusDesc");

      if (state.status === "countdown") {
        overlay.classList.remove("hidden");
        title.innerText = state.countdownVal || "3";
        desc.innerText = "Get ready to pull!";
      } else if (state.status === "playing") {
        overlay.classList.add("hidden");
      } else if (state.status === "ended") {
        overlay.classList.remove("hidden");
        if (state.winner === myTeam) {
          title.innerText = "🎉 VICTORY! 🎉";
          desc.innerText = "Your team won the Tug of War!";
        } else if (state.winner === "TIE") {
          title.innerText = "🤝 IT'S A TIE!";
          desc.innerText = "Great effort from both teams!";
        } else {
          title.innerText = "💔 DEFEAT";
          desc.innerText = "Better luck next match!";
        }
      } else {
        // waiting status
        overlay.classList.remove("hidden");
        title.innerText = "WAITING FOR HOST";
        desc.innerText = "The game will start soon...";
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phase Changes Tug-of-War: Arena Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Fredoka', sans-serif;
      text-align: center;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: #0f172a;
      overflow: hidden;
      transition: background 0.5s ease;
    }

    /* THEME STATES */
    body.team-a-theme { background: linear-gradient(180deg, #1e1b4b, #881337); }
    body.team-b-theme { background: linear-gradient(180deg, #0c4a6e, #1e3a8a); }

    /* CARD CONTAINER */
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 1.5rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      margin: auto;
    }

    /* JOIN FORM SCREEN */
    .join-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #ff5263, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-field {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.2rem;
      text-align: center;
      margin: 1.2rem 0;
      outline: none;
    }
    .input-field:focus { border-color: #38bdf8; }

    .btn-action {
      width: 100%;
      padding: 18px;
      border-radius: 50px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn-action:active { transform: scale(0.96); }

    /* GAME INTERFACE */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .team-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      padding: 6px 16px;
      border-radius: 50px;
      background: rgba(255,255,255,0.15);
    }

    .question-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      line-height: 1.4;
      font-weight: 600;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1px 1px;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .opt-btn {
      padding: 16px 12px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .opt-btn:active { transform: scale(0.95); }

    /* FEEDBACK ANIMATION */
    @keyframes flashGreen { 0% { background: rgba(34,197,94,0.6); } 100% { background: rgba(255,255,255,0.08); } }
    @keyframes flashRed { 0% { background: rgba(239,68,68,0.6); } 100% { background: rgba(255,255,255,0.08); } }
    .correct-flash { animation: flashGreen 0.6s ease; }
    .incorrect-flash { animation: flashRed 0.6s ease; }

    /* DRAMATIC COUNTDOWN OVERLAY */
    .student-cd-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .cd-num {
      font-family: 'Outfit', sans-serif;
      font-size: 10rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 30px rgba(250, 204, 21, 0.8);
      animation: cdPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
    }

    @keyframes cdPop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- COUNTDOWN OVERLAY -->
  <div class="student-cd-overlay" id="studentCdOverlay">
    <div style="font-size: 1.5rem; letter-spacing: 4px; font-weight: 800; color: #fff;">GET READY</div>
    <div class="cd-num" id="studentCdNum">3</div>
  </div>

  <!-- JOIN SCREEN -->
  <div class="card" id="joinScreen">
    <div class="join-title">TUG-OF-WAR ARENA</div>
    <p style="opacity: 0.8; font-size: 0.95rem;">Enter your name to join a team!</p>
    <input type="text" class="input-field" id="studentNameInput" placeholder="Enter your name..." maxlength="15" autocomplete="off">
    <button class="btn-action" onclick="joinGame()">JOIN MATCH</button>
  </div>

  <!-- WAITING SCREEN -->
  <div class="card" id="waitingScreen" style="display: none;">
    <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.8rem; margin-bottom: 0.5rem;" id="waitingTeamTitle">TEAM ASSIGNED</h2>
    <p style="opacity: 0.8; margin-top: 1rem;">Waiting for Host to start the match...</p>
  </div>

  <!-- GAMEPLAY SCREEN -->
  <div class="card" id="gameScreen" style="display: none;">
    <div class="hud-header">
      <div class="team-badge" id="hudTeamBadge">TEAM A</div>
      <div style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.1rem; color: #facc15;" id="streakDisplay">🔥 0 STREAK</div>
    </div>

    <div class="question-box" id="qBox">Loading question...</div>

    <div class="options-grid" id="optionsGrid">
      <button class="opt-btn" onclick="submitAnswer(0)" id="opt0">Option 1</button>
      <button class="opt-btn" onclick="submitAnswer(1)" id="opt1">Option 2</button>
      <button class="opt-btn" onclick="submitAnswer(2)" id="opt2">Option 3</button>
      <button class="opt-btn" onclick="submitAnswer(3)" id="opt3">Option 4</button>
    </div>
  </div>

  <!-- GAME ENDED SCREEN -->
  <div class="card" id="endScreen" style="display: none;">
    <h1 style="font-family: 'Outfit', sans-serif; font-size: 2.5rem; margin-bottom: 0.5rem;" id="endTitle">MATCH OVER</h1>
    <p style="font-size: 1.2rem; opacity: 0.9;" id="endSubtitle">Great effort!</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY",
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com",
      projectId: "tug-of-war-game-f18b3"
    });

    const db = getDatabase(app);

    const questions = [
      { q: "What phase change occurs when solid ice turns directly into water vapor?", options: ["Sublimation", "Deposition", "Melting", "Evaporation"], answer: 0 },
      { q: "What is the reverse process of condensation?", options: ["Freezing", "Evaporation", "Sublimation", "Melting"], answer: 1 },
      { q: "During freezing, a liquid turns into a solid by...", options: ["Gaining Heat", "Losing Heat", "Sublimating", "Boiling"], answer: 1 },
      { q: "Frost forming on a cold windshield is an example of...", options: ["Deposition", "Condensation", "Freezing", "Evaporation"], answer: 0 },
      { q: "What process causes water droplets to form on the outside of a cold glass?", options: ["Evaporation", "Condensation", "Melting", "Sublimation"], answer: 1 }
    ];

    let myPlayerId = null;
    let myTeam = null; // 'A' (Red) or 'B' (Blue)
    let currentQIndex = 0;
    let streak = 0;
    let isSuddenDeath = false;

    // LISTEN TO ROOM RESET / ROSTER CLEAR
    function listenToPresence() {
      if (!myPlayerId) return;
      onValue(ref(db, `game/presence/${myPlayerId}`), (snapshot) => {
        if (!snapshot.exists()) {
          // Host clicked "Clear Roster" -> Redirect back to Join Match screen
          myPlayerId = null;
          myTeam = null;
          document.body.className = "";
          document.getElementById("gameScreen").style.display = "none";
          document.getElementById("waitingScreen").style.display = "none";
          document.getElementById("endScreen").style.display = "none";
          document.getElementById("joinScreen").style.display = "block";
        }
      });
    }

    // JOIN MATCH & AUTOMATICALLY BALANCE TEAMS
    window.joinGame = function() {
      const nameInput = document.getElementById("studentNameInput").value.trim();
      if (!nameInput) return alert("Please enter your name!");

      myPlayerId = "p_" + Math.random().toString(36).substr(2, 9);

      onValue(ref(db, "game/presence"), (snapshot) => {
        if (myTeam) return; // Team already assigned

        const players = snapshot.val() || {};
        let countA = 0, countB = 0;
        Object.values(players).forEach(p => {
          if (p.team === 'A') countA++;
          if (p.team === 'B') countB++;
        });

        // Assign to smaller team
        myTeam = countA <= countB ? 'A' : 'B';

        // Save presence in Firebase
        set(ref(db, `game/presence/${myPlayerId}`), {
          name: nameInput,
          team: myTeam
        });

        setupStudentUI();
        listenToPresence();
      }, { onlyOnce: true });
    };

    function setupStudentUI() {
      document.getElementById("joinScreen").style.display = "none";
      document.getElementById("waitingScreen").style.display = "block";

      if (myTeam === 'A') {
        document.body.className = "team-a-theme";
        document.getElementById("waitingTeamTitle").innerText = "🔴 YOU ARE TEAM RED";
        document.getElementById("hudTeamBadge").innerText = "RED TEAM";
        document.getElementById("hudTeamBadge").style.color = "#ff5263";
      } else {
        document.body.className = "team-b-theme";
        document.getElementById("waitingTeamTitle").innerText = "🔵 YOU ARE TEAM BLUE";
        document.getElementById("hudTeamBadge").innerText = "BLUE TEAM";
        document.getElementById("hudTeamBadge").style.color = "#38bdf8";
      }
    }

    // LISTEN TO GAME STATE
    onValue(ref(db, "game/state"), (snapshot) => {
      const state = snapshot.val() || {};
      const cdOverlay = document.getElementById("studentCdOverlay");
      const cdNum = document.getElementById("studentCdNum");

      // Check Sudden Death 2X multiplier
      isSuddenDeath = state.timerSecs !== undefined && state.timerSecs <= 30;

      if (state.status === "countdown") {
        cdOverlay.style.display = "flex";
        cdNum.innerText = state.countdownVal !== undefined ? state.countdownVal : "3";
      } else {
        cdOverlay.style.display = "none";

        if (state.status === "playing" && myTeam) {
          document.getElementById("waitingScreen").style.display = "none";
          document.getElementById("endScreen").style.display = "none";
          document.getElementById("gameScreen").style.display = "block";
          loadQuestion();
        } else if (state.status === "ended") {
          document.getElementById("gameScreen").style.display = "none";
          document.getElementById("endScreen").style.display = "block";

          const endTitle = document.getElementById("endTitle");
          const endSubtitle = document.getElementById("endSubtitle");

          if (state.winner === myTeam) {
            endTitle.innerText = "🏆 VICTORY!";
            endTitle.style.color = "#4ade80";
            endSubtitle.innerText = "Your team pulled off the win!";
          } else if (state.winner === "TIE") {
            endTitle.innerText = "🤝 IT'S A TIE!";
            endTitle.style.color = "#facc15";
            endSubtitle.innerText = "Evenly matched battle!";
          } else {
            endTitle.innerText = "💔 DEFEAT";
            endTitle.style.color = "#ef4444";
            endSubtitle.innerText = "Better luck next round!";
          }
        }
      }
    });

    function loadQuestion() {
      const q = questions[currentQIndex];
      document.getElementById("qBox").innerText = q.q;
      q.options.forEach((opt, idx) => {
        document.getElementById(`opt${idx}`).innerText = opt;
      });
    }

    window.submitAnswer = function(selectedIdx) {
      const q = questions[currentQIndex];
      const gameCard = document.getElementById("gameScreen");

      if (selectedIdx === q.answer) {
        // CORRECT ANSWER
        streak++;
        gameCard.classList.add("correct-flash");
        setTimeout(() => gameCard.classList.remove("correct-flash"), 600);

        // Calculate pull force (Base 12 + Streak bonus * Sudden Death multiplier)
        const multiplier = isSuddenDeath ? 2 : 1;
        const forceVal = (12 + (streak * 3)) * multiplier;
        const pointsVal = 100 * multiplier;

        // Push pull payload to Firebase queue
        push(ref(db, "game/pulls"), {
          team: myTeam,
          force: forceVal,
          points: pointsVal,
          timestamp: Date.now()
        });
      } else {
        // INCORRECT ANSWER
        streak = 0;
        gameCard.classList.add("incorrect-flash");
        setTimeout(() => gameCard.classList.remove("incorrect-flash"), 600);
      }

      document.getElementById("streakDisplay").innerText = `🔥 ${streak} STREAK`;

      // Cycle through questions
      currentQIndex = (currentQIndex + 1) % questions.length;
      loadQuestion();
    };
  </script>
</body>
</html>

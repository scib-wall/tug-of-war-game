<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tug of War Game Player</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body { 
      font-family: 'Fredoka', sans-serif; 
      text-align: center; 
      padding: 16px; 
      min-height: 100vh;
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      background: linear-gradient(-45deg, #020617, #070e20, #0a1128, #030712); 
      background-size: 300% 300%;
      animation: subtleBG 20s ease infinite; 
      overflow: hidden;
    }

    body.theme-red { 
      background: linear-gradient(-45deg, #05050a, #1f0505, #2e0808, #090a12); 
      background-size: 300% 300%; 
      animation: subtleBG 20s ease infinite; 
    }

    body.theme-blue { 
      background: linear-gradient(-45deg, #020617, #031e38, #072e54, #020617); 
      background-size: 300% 300%; 
      animation: subtleBG 20s ease infinite; 
    }

    @keyframes subtleBG { 
      0% { background-position: 0% 50%; } 
      50% { background-position: 100% 50%; } 
      100% { background-position: 0% 50%; } 
    }

    /* iPhone 17 Dark Glass Theme */
    .card { 
      background: rgba(13, 18, 30, 0.75); 
      backdrop-filter: blur(30px) saturate(180%); 
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      padding: 30px 22px; 
      border-radius: 32px; 
      width: 100%; 
      max-width: 380px; 
      border: 1px solid rgba(255, 255, 255, 0.12); 
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15); 
      transform: translateY(0) scale(1); 
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .input-field { 
      width: 100%; 
      padding: 16px; 
      border-radius: 18px; 
      border: 1px solid rgba(255, 255, 255, 0.12); 
      background: rgba(0, 0, 0, 0.35); 
      color: white; 
      font-family: 'Fredoka', sans-serif; 
      font-size: 1.1rem; 
      text-align: center; 
      margin-bottom: 16px; 
      outline: none; 
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }

    .input-field:focus { 
      border-color: #38bdf8; 
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
    }

    .join-btn { 
      width: 100%; 
      padding: 16px; 
      background: linear-gradient(135deg, #0284c7, #0369a1); 
      color: #ffffff; 
      font-weight: 700; 
      font-size: 1.1rem; 
      border-radius: 18px; 
      border: 1px solid rgba(255,255,255,0.2); 
      cursor: pointer; 
      transition: all 0.2s ease; 
      font-family: 'Fredoka', sans-serif; 
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3);
    }

    .join-btn:active { 
      transform: scale(0.96); 
    }

    .timer-banner { 
      background: rgba(13, 18, 30, 0.8); 
      backdrop-filter: blur(20px); 
      color: #ffffff; 
      font-size: 1rem; 
      font-weight: 700; 
      padding: 10px 24px; 
      border-radius: 50px; 
      border: 1px solid rgba(255, 255, 255, 0.12); 
      margin-bottom: 18px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
      display: none; 
    }

    .team-badge { 
      display: inline-flex; 
      padding: 6px 18px; 
      border-radius: 50px; 
      font-weight: 700; 
      font-size: 0.85rem; 
      margin-bottom: 16px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }

    .badge-red { 
      background: rgba(239, 68, 68, 0.2); 
      color: #fca5a5; 
      border: 1px solid rgba(239, 68, 68, 0.3); 
    }

    .badge-blue { 
      background: rgba(14, 165, 233, 0.2); 
      color: #7dd3fc; 
      border: 1px solid rgba(14, 165, 233, 0.35); 
    }
    
    .question { 
      font-size: 1.25rem; 
      font-weight: 700; 
      margin-bottom: 22px; 
      color: #ffffff; 
      line-height: 1.35; 
    }

    .options { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
    }

    button.opt { 
      width: 100%; 
      min-height: 58px; 
      padding: 12px; 
      border: 1px solid rgba(255, 255, 255, 0.12); 
      border-radius: 18px; 
      background: rgba(255, 255, 255, 0.05); 
      backdrop-filter: blur(16px); 
      font-family: 'Fredoka', sans-serif; 
      font-size: 1rem; 
      font-weight: 600; 
      cursor: pointer; 
      color: #ffffff; 
      transition: all 0.2s ease; 
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }

    button.opt:active { 
      transform: translateY(0) scale(0.96); 
      background: rgba(56, 189, 248, 0.25); 
    }

    .overlay-modal { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      background: rgba(2, 6, 23, 0.9); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
      opacity: 0; 
      pointer-events: none; 
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
      backdrop-filter: blur(0px); 
    }

    .overlay-modal.active { 
      opacity: 1; 
      backdrop-filter: blur(20px); 
    }

    .countdown-number { 
      font-family: 'Outfit', sans-serif; 
      font-size: 10rem; 
      font-weight: 900; 
      color: #38bdf8; 
      text-shadow: 0 0 40px rgba(56, 189, 248, 0.5);
      animation: popZoom 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite; 
    }

    @keyframes popZoom { 0% { transform: scale(0.4); opacity: 0; } 40% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

    .float-fx { 
      position: absolute; 
      font-weight: 700; 
      font-size: 1.3rem; 
      pointer-events: none; 
      animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
      z-index: 100; 
    }

    .fx-plus { color: #4ade80; text-shadow: 0 0 10px rgba(74,222,128,0.5); }
    .fx-minus { color: #ff6b6b; text-shadow: 0 0 10px rgba(255,107,107,0.5); }

    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(1.15); } }

    @keyframes defeatShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-10px, 8px) rotate(-1deg); }
      40% { transform: translate(10px, -8px) rotate(1deg); }
      60% { transform: translate(-8px, -4px) rotate(-1deg); }
      80% { transform: translate(8px, 4px) rotate(1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .defeat-effect {
      animation: defeatShake 0.6s ease-in-out;
      background: linear-gradient(180deg, #120305, #030712) !important;
    }
  </style>
</head>
<body>

  <!-- Sync Countdown Overlay -->
  <div class="overlay-modal" id="syncCountdown">
    <div class="countdown-number" id="syncText">3</div>
  </div>

  <!-- Timer Display -->
  <div class="timer-banner" id="timerBanner">TIME: <span id="gameTimer">02:00</span></div>

  <!-- Login Card -->
  <div class="card" id="loginCard">
    <h2 style="color: white; margin-bottom: 20px; font-family: 'Outfit'; font-weight:800;">Enter Your Name</h2>
    <input type="text" id="playerName" class="input-field" placeholder="Nickname..." maxlength="15" autocomplete="off" />
    <button class="join-btn" onclick="joinGame()">JOIN TEAM</button>
  </div>

  <!-- Game Play Card -->
  <div class="card" id="gameCard" style="display: none;">
    <div id="teamBadge" class="team-badge">Assigning...</div>
    <div class="question" id="qText">Waiting for Host to start...</div>
    <div class="options" id="qOptions"></div>
  </div>

  <!-- Firebase Game Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY", 
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com", 
      projectId: "tug-of-war-game-f18b3"
    });

    const db = getDatabase(app);
    const gameRef = ref(db, "game/state");
    const presenceRef = ref(db, "game/presence");

    const QUESTIONS = {
      A: [
        { q: "What is 8 × 7?", options: ["54", "56", "62", "48"], answer: "56" },
        { q: "Capital of Japan?", options: ["Seoul", "Beijing", "Tokyo", "Bangkok"], answer: "Tokyo" },
        { q: "Boiling point of water?", options: ["90°C", "100°C", "110°C", "120°C"], answer: "100°C" }
      ],
      B: [
        { q: "What is 9 × 6?", options: ["54", "45", "63", "52"], answer: "54" },
        { q: "Which planet is largest?", options: ["Mars", "Saturn", "Jupiter", "Earth"], answer: "Jupiter" },
        { q: "Primary color?", options: ["Green", "Blue", "Purple", "Orange"], answer: "Blue" }
      ]
    };

    let myTeam = null;
    let myName = "";
    let qIdx = 0;
    let isSuddenDeath = false;
    let currentStatus = "waiting";
    let confettiTriggered = false;

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq, type, duration) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    window.joinGame = function() {
      const input = document.getElementById("playerName").value.trim();
      if (!input) return alert("Please enter your name!");
      myName = input;

      initAudio();

      const playerId = Math.random().toString(36).substring(2, 9);
      const myPlayerRef = ref(db, `game/presence/${playerId}`);
      let assignedTeam = null;

      runTransaction(presenceRef, (data) => {
        const currentData = data || {};
        let red = 0, blue = 0;
        
        Object.values(currentData).forEach(p => { 
          if (p.team === "A") red++; else blue++; 
        });

        assignedTeam = red <= blue ? "A" : "B";
        currentData[playerId] = { team: assignedTeam, name: myName };
        return currentData;
      }).then(() => {
        myTeam = assignedTeam;
        onDisconnect(myPlayerRef).remove();
        
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("gameCard").style.display = "block";
        
        const body = document.body;
        const badge = document.getElementById("teamBadge");
        if (myTeam === "A") { 
          body.className = "theme-red"; 
          badge.className = "team-badge badge-red"; 
          badge.innerHTML = "Team Red"; 
        } else { 
          body.className = "theme-blue"; 
          badge.className = "team-badge badge-blue"; 
          badge.innerHTML = "Team Blue"; 
        }
        
        renderStateUI();
      }).catch(err => {
        console.error("Failed to join game:", err);
        alert("Unable to join match. Please check your network connection.");
      });
    };

    onValue(gameRef, (snapshot) => {
      const data = snapshot.val() || {};
      const status = data.status || "waiting";
      currentStatus = status;

      if (status === "waiting") {
        confettiTriggered = false;
        document.body.classList.remove("defeat-effect");
      }

      const syncOverlay = document.getElementById("syncCountdown");
      const syncText = document.getElementById("syncText");
      if (syncOverlay) {
        if (status === "countdown") {
          syncOverlay.classList.add("active");
          if (syncText) syncText.innerText = data.countdownVal;
        } else {
          syncOverlay.classList.remove("active");
        }
      }

      const t = data.timerSecs !== undefined ? data.timerSecs : 120;
      isSuddenDeath = t <= 30 && t > 0;
      const banner = document.getElementById("timerBanner");
      if (banner) {
        if (status === "playing") {
          banner.style.display = "block";
          if (isSuddenDeath) {
            banner.style.background = "rgba(220, 38, 38, 0.4)";
            banner.innerHTML = `⚡ 2X PULL FORCE! <span>${t}s</span>`;
          } else {
            banner.style.background = "rgba(13, 18, 30, 0.8)";
            const m = Math.floor(t / 60).toString().padStart(2, '0');
            const s = (t % 60).toString().padStart(2, '0');
            banner.innerHTML = `TIME: <span>${m}:${s}</span>`;
          }
        } else {
          banner.style.display = "none";
        }
      }

      if (status === "ended") {
        const qOptions = document.getElementById("qOptions");
        const qText = document.getElementById("qText");
        
        if (qOptions) qOptions.innerHTML = "";
        if (qText) {
          if (data.winner === myTeam) {
            qText.innerHTML = "<span style='color:#4ade80; font-size:1.8rem; font-family:Outfit; font-weight:900;'>🏆 VICTORY!</span><br><span style='font-size:0.95rem; opacity:0.8;'>Check the main screen!</span>";
            if (!confettiTriggered) {
              confettiTriggered = true;
              confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
              playBeep(523.25, "sine", 0.2); 
              setTimeout(() => playBeep(659.25, "sine", 0.2), 150);
              setTimeout(() => playBeep(783.99, "sine", 0.4), 300);
            }
          } else if (data.winner === "TIE") {
            qText.innerHTML = "<span style='font-size:1.5rem; font-family:Outfit; font-weight:800;'>🤝 DRAW GAME</span>";
          } else {
            qText.innerHTML = "<span style='color:#ff6b6b; font-size:1.8rem; font-family:Outfit; font-weight:900;'>💀 DEFEAT</span>";
            if (!confettiTriggered) {
              confettiTriggered = true;
              document.body.classList.add("defeat-effect");
              playBeep(180, "sawtooth", 0.4);
              setTimeout(() => playBeep(120, "sawtooth", 0.5), 200);
            }
          }
        }
      }

      if (myTeam) renderStateUI();
    });

    function renderStateUI() {
      const qText = document.getElementById("qText");
      const qOptions = document.getElementById("qOptions");

      if (currentStatus === "waiting") {
        if (qText) qText.innerText = "Waiting for Host to start match...";
        if (qOptions) qOptions.innerHTML = "";
      } else if (currentStatus === "playing" && qOptions && qOptions.innerHTML === "") {
        renderQ();
      }
    }

    window.handleAnswer = function(selected, evt) {
      if (currentStatus !== "playing") return;
      const isCorrect = selected === QUESTIONS[myTeam][qIdx].answer;
      
      const el = document.createElement("div");
      el.className = `float-fx ${isCorrect ? 'fx-plus' : 'fx-minus'}`;
      el.innerText = isCorrect ? "+5 PTS" : "-5 PULL";
      el.style.left = `${evt.clientX - 25}px`; 
      el.style.top = `${evt.clientY - 15}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);

      if (isCorrect) playBeep(587.33, "sine", 0.2); else playBeep(130.81, "square", 0.3);

      let pullForce = isCorrect ? (isSuddenDeath ? 30 : 15) : -5;
      let pointsAdded = isCorrect ? 5 : 0;
      const dir = myTeam === "A" ? -1 : 1;

      runTransaction(gameRef, (data) => {
        if (!data || data.status !== "playing") return data;
        let pos = Math.max(-100, Math.min(100, (data.ropePosition || 0) + (pullForce * dir)));
        return { 
          ...data, 
          ropePosition: pos, 
          scoreRed: myTeam === "A" ? (data.scoreRed || 0) + pointsAdded : (data.scoreRed || 0),
          scoreBlue: myTeam === "B" ? (data.scoreBlue || 0) + pointsAdded : (data.scoreBlue || 0) 
        };
      });

      qIdx = (qIdx + 1) % QUESTIONS[myTeam].length;
      renderQ();
    };

    function renderQ() {
      if (!myTeam || currentStatus !== "playing") return;
      const q = QUESTIONS[myTeam][qIdx];
      const qText = document.getElementById("qText");
      const qOptions = document.getElementById("qOptions");

      if (qText) qText.innerText = q.q;
      if (qOptions) {
        qOptions.innerHTML = q.options.map(opt => `<button class="opt" onclick="handleAnswer('${opt}', event)">${opt}</button>`).join('');
      }
    }
  </script>
</body>
</html>

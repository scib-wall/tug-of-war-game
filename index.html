<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase Changes: Student Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body { 
      font-family: 'Fredoka', sans-serif; 
      text-align: center; 
      color: #ffffff; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      /* Default neutral state */
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0369a1, #312e81);
      background-size: 300% 300%;
      animation: subtleBG 16s ease infinite;
      transition: background 1s ease-in-out;
      overflow: hidden;
    }

    /* DRAMATIC TEAM-SPECIFIC BACKGROUND GRADIENTS */
    body.team-red {
      background: linear-gradient(-45deg, #7f1d1d, #ef4444, #450a0a, #000000) !important;
      background-size: 300% 300% !important;
      animation: subtleBG 6s ease infinite !important;
    }

    body.team-blue {
      background: linear-gradient(-45deg, #075985, #0284c7, #030712, #0f172a) !important;
      background-size: 300% 300% !important;
      animation: subtleBG 6s ease infinite !important;
    }

    @keyframes subtleBG { 
      0% { background-position: 0% 50%; } 
      50% { background-position: 100% 50%; } 
      100% { background-position: 0% 50%; } 
    }

    /* CARD CONTAINER WITH ANIMATED PERIMETER RUNNING LIGHT */
    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 450px;
      border-radius: 30px;
      padding: 3px;
      background: linear-gradient(90deg, #38bdf8, #ef4444, #facc15, #38bdf8);
      background-size: 300% 300%;
      animation: runningBorder 4s linear infinite;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }

    /* PERIMETER INTENSIFIES ACCORDING TO TEAMS */
    body.team-red .card-wrapper {
      background: linear-gradient(90deg, #ff0000, #ff5263, #3a0000, #ff0000);
      background-size: 300% 300%;
      animation: runningBorder 2.5s linear infinite;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.4);
    }

    body.team-blue .card-wrapper {
      background: linear-gradient(90deg, #0284c7, #38bdf8, #001e3d, #0284c7);
      background-size: 300% 300%;
      animation: runningBorder 2.5s linear infinite;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.4);
    }

    @keyframes runningBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border-radius: 27px;
      padding: 24px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    h1 { font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; }
    
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.4);
      color: white;
      font-size: 1.1rem;
      font-family: 'Fredoka', sans-serif;
      text-align: center;
      outline: none;
    }

    .btn {
      padding: 14px;
      border-radius: 50px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
    }
    .btn:active { transform: scale(0.96); }

    .join-btn { 
      background: linear-gradient(135deg, #0284c7, #2563eb); 
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4); 
    }

    .q-box { font-size: 1.15rem; line-height: 1.4; font-weight: 600; min-height: 60px; display: flex; align-items: center; justify-content: center; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    button.opt {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 16px 10px;
      border-radius: 18px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button.opt:active:not(:disabled) { transform: scale(0.95); background: rgba(255,255,255,0.25); }

    button.opt:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(80%);
      transform: none !important;
    }

    /* COOL-DOWN WARNING BANNER & PROGRESS BAR */
    .cooldown-banner {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: none;
      flex-direction: column;
      gap: 6px;
      animation: pulseAlert 0.6s infinite alternate;
    }

    .cooldown-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      overflow: hidden;
    }

    .cooldown-bar-fill {
      width: 100%;
      height: 100%;
      background: #f87171;
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    @keyframes pulseAlert {
      from { opacity: 0.85; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1.01); }
    }

    /* FLOATING FEEDBACK FX */
    .float-fx {
      position: fixed;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 1000;
    }
    .fx-plus { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.6); }
    .fx-minus { color: #f87171; text-shadow: 0 0 10px rgba(248, 113, 113, 0.6); }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
    }

    /* FULLSCREEN DRAMATIC COUNTDOWN OVERLAY */
    .countdown-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(15px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .cd-number {
      font-family: 'Outfit', sans-serif;
      font-size: 8rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 30px rgba(250, 204, 21, 0.8), 0 0 60px rgba(250, 204, 21, 0.4);
      animation: cdPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
    }

    .cd-label {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
    }

    @keyframes cdPop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- DRAMATIC COUNTDOWN OVERLAY -->
  <div class="countdown-overlay" id="cdOverlay">
    <div class="cd-label">GET READY</div>
    <div class="cd-number" id="cdNum">3</div>
  </div>

  <div class="card-wrapper">
    <!-- JOIN CARD -->
    <div class="card" id="joinCard">
      <h1>JOIN THE MATCH</h1>
      <input type="text" id="playerName" placeholder="Enter Your Name" maxlength="15">
      <button class="btn join-btn" style="width: 100%; margin-top: 6px;" onclick="joinGame()">JOIN MATCH</button>
    </div>

    <!-- GAME PLAY CARD -->
    <div class="card" id="gameCard" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="playerBadge" style="font-weight: 700; opacity: 0.9;"></span>
        <span id="statusBadge" style="font-weight: 800; color: #facc15;">WAITING...</span>
      </div>

      <!-- COOL-DOWN BANNER -->
      <div class="cooldown-banner" id="cooldownBanner">
        <div id="cooldownText">⚠️ SLIPPED! REGAINING FOOTING (4.0s)...</div>
        <div class="cooldown-bar-bg">
          <div class="cooldown-bar-fill" id="cooldownBar"></div>
        </div>
      </div>

      <div class="q-box" id="qText">Get Ready!</div>

      <div class="options-grid" id="optionsGrid">
        <button class="opt" disabled>A</button>
        <button class="opt" disabled>B</button>
        <button class="opt" disabled>C</button>
        <button class="opt" disabled>D</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const app = initializeApp({
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY", 
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com", 
      projectId: "tug-of-war-game-f18b3"
    });
    const db = getDatabase(app);
    const gameRef = ref(db, "game/state");
    const pullsRef = ref(db, "game/pulls");

    const QUESTIONS = {
      A: [
        { q: "Which state of matter has no fixed shape or volume?", opts: ["Solid", "Liquid", "Gas", "Ice"], answer: "Gas" },
        { q: "Water droplets form on the outside of a cold glass because of:", opts: ["Melting", "Condensation", "Freezing", "Sublimation"], answer: "Condensation" },
        { q: "What is the process when a liquid changes into a solid?", opts: ["Melting", "Freezing", "Condensation", "Sublimation"], answer: "Freezing" },
        { q: "What happens to ice when it is heated?", opts: ["It freezes", "It melts", "It deposits", "It condenses"], answer: "It melts" },
        { q: "Clouds form when water vapor undergoes:", opts: ["Melting", "Freezing", "Condensation", "Sublimation"], answer: "Condensation" },
        { q: "When water boils, it changes from:", opts: ["Solid to liquid", "Liquid to gas", "Gas to liquid", "Solid to gas"], answer: "Liquid to gas" },
        { q: "Which phase change releases heat?", opts: ["Melting", "Evaporation", "Sublimation", "Freezing"], answer: "Freezing" },
        { q: "Which state of matter takes the shape of its container but has a fixed volume?", opts: ["Solid", "Liquid", "Gas", "Plasma"], answer: "Liquid" },
        { q: "Butter becoming liquid when heated is an example of:", opts: ["Freezing", "Melting", "Condensation", "Deposition"], answer: "Melting" },
        { q: "What happens to water when it is placed in a freezer?", opts: ["It melts", "It evaporates", "It freezes", "It sublimates"], answer: "It freezes" },
        { q: "Which state of matter has a fixed shape?", opts: ["Gas", "Liquid", "Solid", "Vapor"], answer: "Solid" },
        { q: "What is the process when a gas changes into a liquid?", opts: ["Melting", "Condensation", "Freezing", "Sublimation"], answer: "Condensation" },
        { q: "What is the process when a solid changes directly into a gas?", opts: ["Sublimation", "Melting", "Freezing", "Condensation"], answer: "Sublimation" },
        { q: "Wet clothes dry because water undergoes:", opts: ["Evaporation", "Freezing", "Deposition", "Melting"], answer: "Evaporation" },
        { q: "Frost forming on a cold surface is an example of:", opts: ["Deposition", "Melting", "Evaporation", "Vaporization"], answer: "Deposition" },
        { q: "What is the process when a liquid changes into a gas?", opts: ["Freezing", "Melting", "Vaporization", "Deposition"], answer: "Vaporization" },
        { q: "Which phase change requires heat?", opts: ["Freezing", "Condensation", "Melting", "Deposition"], answer: "Melting" },
        { q: "Dry ice changing directly into gas is an example of:", opts: ["Freezing", "Condensation", "Sublimation", "Melting"], answer: "Sublimation" },
        { q: "What is the process when a solid changes into a liquid?", opts: ["Melting", "Freezing", "Evaporation", "Deposition"], answer: "Melting" },
        { q: "What is the process when a gas changes directly into a solid?", opts: ["Evaporation", "Melting", "Deposition", "Freezing"], answer: "Deposition" }
      ],
      B: [
        { q: "What happens to ice when it is heated?", opts: ["It freezes", "It melts", "It deposits", "It condenses"], answer: "It melts" },
        { q: "Dry ice changing directly into gas is an example of:", opts: ["Freezing", "Condensation", "Sublimation", "Melting"], answer: "Sublimation" },
        { q: "When water boils, it changes from:", opts: ["Solid to liquid", "Liquid to gas", "Gas to liquid", "Solid to gas"], answer: "Liquid to gas" },
        { q: "What is the process when a solid changes directly into a gas?", opts: ["Sublimation", "Melting", "Freezing", "Condensation"], answer: "Sublimation" },
        { q: "Which state of matter has no fixed shape or volume?", opts: ["Solid", "Liquid", "Gas", "Ice"], answer: "Gas" },
        { q: "What is the process when a gas changes directly into a solid?", opts: ["Evaporation", "Melting", "Deposition", "Freezing"], answer: "Deposition" },
        { q: "What is the process when a solid changes into a liquid?", opts: ["Melting", "Freezing", "Evaporation", "Deposition"], answer: "Melting" },
        { q: "Clouds form when water vapor undergoes:", opts: ["Melting", "Freezing", "Condensation", "Sublimation"], answer: "Condensation" },
        { q: "What is the process when a liquid changes into a solid?", opts: ["Melting", "Freezing", "Condensation", "Sublimation"], answer: "Freezing" },
        { q: "Frost forming on a cold surface is an example of:", opts: ["Deposition", "Melting", "Evaporation", "Vaporization"], answer: "Deposition" },
        { q: "Which phase change releases heat?", opts: ["Melting", "Evaporation", "Sublimation", "Freezing"], answer: "Freezing" },
        { q: "Which state of matter has a fixed shape?", opts: ["Gas", "Liquid", "Solid", "Vapor"], answer: "Solid" },
        { q: "Which state of matter takes the shape of its container but has a fixed volume?", opts: ["Solid", "Liquid", "Gas", "Plasma"], answer: "Liquid" },
        { q: "Water droplets form on the outside of a cold glass because of:", opts: ["Melting", "Condensation", "Freezing", "Sublimation"], answer: "Condensation" },
        { q: "Wet clothes dry because water undergoes:", opts: ["Evaporation", "Freezing", "Deposition", "Melting"], answer: "Evaporation" },
        { q: "What happens to water when it is placed in a freezer?", opts: ["It melts", "It evaporates", "It freezes", "It sublimates"], answer: "It freezes" },
        { q: "Which phase change requires heat?", opts: ["Freezing", "Condensation", "Melting", "Deposition"], answer: "Melting" },
        { q: "What is the process when a gas changes into a liquid?", opts: ["Melting", "Condensation", "Freezing", "Sublimation"], answer: "Condensation" },
        { q: "Butter becoming liquid when heated is an example of:", opts: ["Freezing", "Melting", "Condensation", "Deposition"], answer: "Melting" },
        { q: "What is the process when a liquid changes into a gas?", opts: ["Freezing", "Melting", "Vaporization", "Deposition"], answer: "Vaporization" }
      ]
    };

    let myName = "", myTeam = "", qIdx = 0, currentStatus = "waiting", isSuddenDeath = false, isCoolingDown = false;
    let lastCdVal = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    window.joinGame = function() {
      const nameInput = document.getElementById("playerName").value.trim();
      if (!nameInput) return alert("Please enter your name!");

      myName = nameInput;

      // Deterministic auto-team assignment based on name + timestamp hash
      const uniqueId = `${myName}_${Date.now()}`;
      let hash = 0;
      for (let i = 0; i < uniqueId.length; i++) {
        hash = (hash << 5) - hash + uniqueId.charCodeAt(i);
        hash |= 0;
      }
      myTeam = Math.abs(hash) % 2 === 0 ? 'A' : 'B';

      // Register presence in Firebase
      const playerRef = ref(db, `game/presence/${uniqueId}`);
      set(playerRef, { name: myName, team: myTeam });
      onDisconnect(playerRef).remove();

      // Apply Team Color Theme to Whole Body & Running Borders
      document.body.className = myTeam === 'A' ? 'team-red' : 'team-blue';

      // Update UI
      document.getElementById("joinCard").style.display = "none";
      document.getElementById("gameCard").style.display = "flex";
      
      const badge = document.getElementById("playerBadge");
      badge.innerText = `${myName} (${myTeam === 'A' ? 'RED TEAM' : 'BLUE TEAM'})`;
      badge.style.color = myTeam === 'A' ? '#ff8593' : '#7dd3fc';

      listenToGame();
    };

    function listenToGame() {
      onValue(gameRef, (snapshot) => {
        const data = snapshot.val() || {};
        currentStatus = data.status || "waiting";
        isSuddenDeath = (data.timerSecs !== undefined && data.timerSecs <= 30 && data.timerSecs > 0);

        const statusBadge = document.getElementById("statusBadge");
        const cdOverlay = document.getElementById("cdOverlay");
        const cdNum = document.getElementById("cdNum");

        if (currentStatus === "countdown") {
          const cdVal = data.countdownVal !== undefined ? data.countdownVal : "3";
          
          // Show dramatic fullscreen overlay
          cdOverlay.style.display = "flex";
          cdNum.innerText = cdVal;

          // Sound trigger on number tick
          if (cdVal !== lastCdVal) {
            playBeep(cdVal === "GO!" ? 880 : 440, "triangle", 0.25);
            lastCdVal = cdVal;
          }

          statusBadge.innerText = `READY...`;
          statusBadge.style.color = "#facc15";
          document.getElementById("qText").innerText = "Get Ready!";
          disableButtons(true);
        } else {
          // Hide countdown overlay during active play or waiting
          cdOverlay.style.display = "none";
          lastCdVal = null;

          if (currentStatus === "playing") {
            statusBadge.innerText = isSuddenDeath ? "🔥 SUDDEN DEATH 2X!" : "PULL!";
            statusBadge.style.color = isSuddenDeath ? "#ff2a5f" : "#4ade80";
            if (!isCoolingDown) {
              renderQ();
            }
          } else if (currentStatus === "ended") {
            statusBadge.innerText = "MATCH OVER";
            statusBadge.style.color = "#ef4444";
            document.getElementById("qText").innerText = data.winner === myTeam ? "🎉 YOUR TEAM WON!" : (data.winner === "TIE" ? "🤝 IT'S A TIE!" : "💔 MATCH LOST");
            disableButtons(true);
          } else {
            statusBadge.innerText = "WAITING FOR HOST...";
            statusBadge.style.color = "#facc15";
            document.getElementById("qText").innerText = "Waiting for host to start...";
            disableButtons(true);
          }
        }
      });
    }

    function renderQ() {
      if (currentStatus !== "playing" || isCoolingDown) return;
      const q = QUESTIONS[myTeam][qIdx];
      document.getElementById("qText").innerText = q.q;
      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = "";

      q.opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "opt";
        btn.innerText = opt;
        btn.onclick = (e) => handleAnswer(opt, e);
        grid.appendChild(btn);
      });
    }

    function disableButtons(disabled) {
      document.querySelectorAll("button.opt").forEach(b => b.disabled = disabled);
    }

    window.handleAnswer = function(selected, evt) {
      if (currentStatus !== "playing" || isCoolingDown) return;

      const isCorrect = selected === QUESTIONS[myTeam][qIdx].answer;
      
      // Floating score FX
      const el = document.createElement("div");
      el.className = `float-fx ${isCorrect ? 'fx-plus' : 'fx-minus'}`;
      el.innerText = isCorrect ? "+5 PTS" : "SLIPPED!";
      el.style.left = `${evt.clientX - 25}px`; 
      el.style.top = `${evt.clientY - 15}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);

      if (isCorrect) {
        playBeep(587.33, "sine", 0.2);
        
        let pullForce = isSuddenDeath ? 30 : 15;
        let pointsAdded = 5;

        push(pullsRef, {
          team: myTeam,
          force: pullForce,
          points: pointsAdded,
          timestamp: Date.now()
        });

        qIdx = (qIdx + 1) % QUESTIONS[myTeam].length;
        renderQ();

      } else {
        // Slipped Penalty - Increased to 4 seconds
        playBeep(130.81, "square", 0.3);
        triggerCooldown(4);
      }
    };

    function triggerCooldown(seconds) {
      isCoolingDown = true;
      const banner = document.getElementById("cooldownBanner");
      const text = document.getElementById("cooldownText");
      const bar = document.getElementById("cooldownBar");
      disableButtons(true);

      banner.style.display = "flex";
      bar.style.width = "100%";

      const startTime = Date.now();
      const durationMs = seconds * 1000;

      const timer = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const remainingMs = Math.max(0, durationMs - elapsed);
        const percentLeft = (remainingMs / durationMs) * 100;

        bar.style.width = `${percentLeft}%`;
        text.innerText = `⚠️ SLIPPED! REGAINING FOOTING (${(remainingMs / 1000).toFixed(1)}s)...`;

        if (remainingMs <= 0) {
          clearInterval(timer);
          isCoolingDown = false;
          banner.style.display = "none";
          
          if (currentStatus === "playing") {
            qIdx = (qIdx + 1) % QUESTIONS[myTeam].length;
            renderQ();
          }
        }
      }, 50);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase Changes: Tug of War - Player</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes sudden-death-pulse {
      0%, 100% { background-color: rgba(225, 29, 72, 0.9); }
      50% { background-color: rgba(217, 119, 6, 0.9); }
    }
    .animate-sudden-death {
      animation: sudden-death-pulse 1s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans flex flex-col justify-between p-4">

  <!-- Header / Team Info -->
  <header class="bg-slate-800 border border-slate-700 rounded-2xl p-4 flex justify-between items-center shadow-lg">
    <div>
      <h1 class="text-sm font-bold text-slate-400">Player Portal</h1>
      <div id="playerNameDisplay" class="text-lg font-black text-amber-400">Connecting...</div>
    </div>
    <div id="teamBadge" class="px-3 py-1 rounded-full font-black text-xs uppercase tracking-wider bg-slate-700 text-slate-300">
      Assigning...
    </div>
  </header>

  <!-- Sudden Death Alert Banner (Hidden by default) -->
  <div id="suddenDeathNotice" class="hidden my-2 p-3 rounded-xl animate-sudden-death text-center text-white font-black text-xs tracking-wider uppercase shadow-xl border border-amber-300">
    ⚡ SUDDEN DEATH MODE! LAST 30 SECONDS! ⚡
  </div>

  <!-- Game Active Area -->
  <main class="flex-1 flex flex-col justify-center my-4 max-w-md mx-auto w-full gap-4">
    
    <!-- Question Box -->
    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 text-center shadow-2xl relative overflow-hidden">
      <span class="text-[10px] font-bold uppercase tracking-widest text-amber-400/80 block mb-2">Phase Changes Quiz</span>
      <h2 id="questionText" class="text-xl font-bold text-white leading-snug">Waiting for game to start...</h2>

      <!-- Penalty Lockout Overlay -->
      <div id="penaltyOverlay" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex-col items-center justify-center z-20">
        <span class="text-3xl mb-1">⏳</span>
        <span class="text-rose-400 font-black text-lg">WRONG ANSWER!</span>
        <p class="text-slate-300 text-xs mt-1">Locked out for <span id="penaltyTimer" class="font-bold text-amber-400">5</span>s</p>
      </div>
    </div>

    <!-- Answer Choices -->
    <div id="choicesContainer" class="grid grid-cols-1 gap-3">
      <!-- Options rendered via JS -->
    </div>

  </main>

  <!-- Footer / Score -->
  <footer class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-3 text-center text-xs text-slate-400">
    Your Score: <span id="playerScore" class="font-bold text-emerald-400 font-mono text-sm">0</span>
  </footer>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-rtdb.js";

    const firebaseConfig = {
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Player Identity
    let playerId = localStorage.getItem("tug_player_id");
    if (!playerId) {
      playerId = "player_" + Math.random().toString(36).substr(2, 9);
      localStorage.setItem("tug_player_id", playerId);
    }

    let playerName = localStorage.getItem("tug_player_name");
    if (!playerName) {
      playerName = prompt("Enter your name:") || "Player " + Math.floor(Math.random() * 100);
      localStorage.setItem("tug_player_name", playerName);
    }
    document.getElementById("playerNameDisplay").innerText = playerName;

    // References
    const refPresence = ref(db, `game/presence/${playerId}`);
    const refState = ref(db, "game/state");
    const refPulls = ref(db, "game/pulls");

    let playerTeam = null;
    let playerScore = 0;
    let currentPenaltyEnd = 0;
    let penaltyInterval = null;
    let currentQuestion = null;

    // Sample Phase Changes Questions
    const questions = [
      { q: "Solid to Liquid is called?", choices: ["Melting", "Freezing", "Evaporation", "Sublimation"], correct: 0 },
      { q: "Liquid to Gas is called?", choices: ["Condensation", "Evaporation", "Freezing", "Deposition"], correct: 1 },
      { q: "Gas to Liquid is called?", choices: ["Melting", "Sublimation", "Condensation", "Freezing"], correct: 2 },
      { q: "Liquid to Solid is called?", choices: ["Freezing", "Melting", "Deposition", "Evaporation"], correct: 0 },
      { q: "Solid directly to Gas is called?", choices: ["Deposition", "Sublimation", "Melting", "Condensation"], correct: 1 },
      { q: "Gas directly to Solid is called?", choices: ["Sublimation", "Evaporation", "Deposition", "Freezing"], correct: 2 }
    ];

    // Register Presence
    set(refPresence, {
      name: playerName,
      score: 0,
      wrongCount: 0,
      lastActive: serverTimestamp()
    });

    // Listen to Player Data (Team Assignment & Cooldowns)
    onValue(refPresence, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      playerTeam = data.team;
      playerScore = data.score || 0;
      document.getElementById("playerScore").innerText = playerScore;

      // Update Team Badge UI
      const badge = document.getElementById("teamBadge");
      if (playerTeam === 'red') {
        badge.innerText = "🔴 Red Team";
        badge.className = "px-3 py-1 rounded-full font-black text-xs uppercase tracking-wider bg-red-900/80 text-red-300 border border-red-600";
      } else if (playerTeam === 'blue') {
        badge.innerText = "🔵 Blue Team";
        badge.className = "px-3 py-1 rounded-full font-black text-xs uppercase tracking-wider bg-blue-900/80 text-blue-300 border border-blue-600";
      }

      // Handle Cooldown Timer
      if (data.cooldownUntil && Date.now() < data.cooldownUntil) {
        startPenaltyTimer(data.cooldownUntil);
      }
    });

    // Listen to Game State (Sudden Death & Match Status)
    onValue(refState, (snapshot) => {
      const state = snapshot.val();
      if (!state) return;

      const suddenDeathNotice = document.getElementById("suddenDeathNotice");
      if (state.status === "PLAYING" && state.isSuddenDeath) {
        suddenDeathNotice.classList.remove("hidden");
      } else {
        suddenDeathNotice.classList.add("hidden");
      }

      if (state.status === "PLAYING") {
        if (!currentQuestion) loadNextQuestion();
      } else if (state.status === "ENDED") {
        document.getElementById("questionText").innerText = "Match Ended!";
        document.getElementById("choicesContainer").innerHTML = "";
        currentQuestion = null;
      }
    });

    function loadNextQuestion() {
      const randomQ = questions[Math.floor(Math.random() * questions.length)];
      currentQuestion = randomQ;

      document.getElementById("questionText").innerText = randomQ.q;
      const container = document.getElementById("choicesContainer");
      container.innerHTML = "";

      randomQ.choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full bg-slate-800 hover:bg-slate-700 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl border border-slate-700 transition-all text-sm";
        btn.innerText = choice;
        btn.onclick = () => submitAnswer(idx);
        container.appendChild(btn);
      });
    }

    function submitAnswer(chosenIdx) {
      if (!playerTeam || Date.now() < currentPenaltyEnd) return;

      const isCorrect = (chosenIdx === currentQuestion.correct);

      if (isCorrect) {
        playerScore += 1;
        set(ref(db, `game/presence/${playerId}/score`), playerScore);
      }

      // Push Pull Action to Firebase
      push(refPulls, {
        playerId: playerId,
        team: playerTeam,
        isCorrect: isCorrect,
        timestamp: serverTimestamp()
      });

      loadNextQuestion();
    }

    function startPenaltyTimer(untilTimestamp) {
      currentPenaltyEnd = untilTimestamp;
      const overlay = document.getElementById("penaltyOverlay");
      const timerDisplay = document.getElementById("penaltyTimer");
      overlay.classList.remove("hidden");
      overlay.classList.add("flex");

      clearInterval(penaltyInterval);
      penaltyInterval = setInterval(() => {
        const remaining = Math.ceil((currentPenaltyEnd - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(penaltyInterval);
          overlay.classList.add("hidden");
          overlay.classList.remove("flex");
        } else {
          timerDisplay.innerText = remaining;
        }
      }, 200);
    }
  </script>
</body>
</html>

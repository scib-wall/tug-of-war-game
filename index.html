<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, runTransaction, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const app = initializeApp({
    apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY", 
    authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
    databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com", 
    projectId: "tug-of-war-game-f18b3"
  });
  const db = getDatabase(app);
  const gameRef = ref(db, "game/state");
  const presenceRef = ref(db, "game/presence");

  const QUESTIONS = {
    A: [
      { q: "What is 8 × 7?", options: ["54", "56", "62", "48"], answer: "56" },
      { q: "Capital of Japan?", options: ["Seoul", "Beijing", "Tokyo", "Bangkok"], answer: "Tokyo" },
      { q: "Boiling point of water?", options: ["90°C", "100°C", "110°C", "120°C"], answer: "100°C" }
    ],
    B: [
      { q: "What is 9 × 6?", options: ["54", "45", "63", "52"], answer: "54" },
      { q: "Which planet is largest?", options: ["Mars", "Saturn", "Jupiter", "Earth"], answer: "Jupiter" },
      { q: "Primary color?", options: ["Green", "Blue", "Purple", "Orange"], answer: "Blue" }
    ]
  };

  let myTeam = null, myName = "", qIdx = 0, isSuddenDeath = false, currentStatus = "waiting";

  // FIX 2: Audio Context setup
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playBeep(freq, type, duration) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  }

  // FIX 1: Updated joinGame with atomic transaction & player presence
  window.joinGame = function() {
    const input = document.getElementById("playerName").value.trim();
    if (!input) return alert("Please enter your name!");
    myName = input;

    // Unlock audio on physical tap
    initAudio();

    const playerId = Math.random().toString(36).substring(2, 9);
    const myPlayerRef = ref(db, `game/presence/${playerId}`);

    runTransaction(presenceRef, (data) => {
      const currentData = data || {};
      let red = 0, blue = 0;
      
      Object.values(currentData).forEach(p => { 
        if (p.team === "A") red++; else blue++; 
      });

      myTeam = red <= blue ? "A" : "B";
      currentData[playerId] = { team: myTeam, name: myName };
      return currentData;
    }).then(() => {
      onDisconnect(myPlayerRef).remove();
      
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("gameCard").style.display = "block";
      
      const body = document.body;
      const badge = document.getElementById("teamBadge");
      if (myTeam === "A") { 
        body.className = "theme-red"; 
        badge.className = "team-badge badge-red"; 
        badge.innerHTML = "Team Red"; 
      } else { 
        body.className = "theme-blue"; 
        badge.className = "team-badge badge-blue"; 
        badge.innerHTML = "Team Blue"; 
      }
      
      renderStateUI();
    }).catch(err => {
      console.error("Failed to join game:", err);
    });
  };

  onValue(gameRef, (snapshot) => {
    const data = snapshot.val() || {};
    const status = data.status || "waiting";
    currentStatus = status;

    // Sync Countdown Overlay
    const syncOverlay = document.getElementById("syncCountdown");
    if (status === "countdown") {
      syncOverlay.classList.add("active");
      document.getElementById("syncText").innerText = data.countdownVal;
    } else {
      syncOverlay.classList.remove("active");
    }

    // Timer updates
    const t = data.timerSecs !== undefined ? data.timerSecs : 120;
    isSuddenDeath = t <= 30 && t > 0;
    const banner = document.getElementById("timerBanner");
    if (status === "playing") {
      banner.style.display = "block";
      if (isSuddenDeath) {
        banner.style.background = "rgba(239, 68, 68, 0.3)";
        banner.innerHTML = `⚡ 2X PULL FORCE! <span>${t}s</span>`;
      } else {
        banner.style.background = "rgba(255, 255, 255, 0.1)";
        const m = Math.floor(t / 60).toString().padStart(2, '0');
        const s = (t % 60).toString().padStart(2, '0');
        banner.innerHTML = `TIME: <span>${m}:${s}</span>`;
      }
    } else {
      banner.style.display = "none";
    }

    if (status === "ended") {
      document.getElementById("qOptions").innerHTML = "";
      if (data.winner === myTeam) {
        document.getElementById("qText").innerHTML = "<span style='color:#4ade80; font-size:1.5rem;'>🏆 YOU WON!</span><br>Check the main screen!";
      } else if (data.winner === "TIE") {
        document.getElementById("qText").innerHTML = "🤝 DRAW GAME";
      } else {
        document.getElementById("qText").innerHTML = "<span style='color:#ff6b6b; font-size:1.5rem;'>💀 DEFEAT</span>";
      }
    }

    if (myTeam) renderStateUI();
  });

  function renderStateUI() {
    if (currentStatus === "waiting") {
      document.getElementById("qText").innerText = "Waiting for Host to start match...";
      document.getElementById("qOptions").innerHTML = "";
    } else if (currentStatus === "playing" && document.getElementById("qOptions").innerHTML === "") {
      renderQ();
    }
  }

  window.handleAnswer = function(selected, evt) {
    if (currentStatus !== "playing") return;
    const isCorrect = selected === QUESTIONS[myTeam][qIdx].answer;
    
    const el = document.createElement("div");
    el.className = `float-fx ${isCorrect ? 'fx-plus' : 'fx-minus'}`;
    el.innerText = isCorrect ? "+5 PTS" : "-5 PULL";
    el.style.left = `${evt.clientX - 25}px`; el.style.top = `${evt.clientY - 15}px`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);

    if (isCorrect) playBeep(587.33, "sine", 0.2); else playBeep(130.81, "square", 0.3);

    let pullForce = isCorrect ? (isSuddenDeath ? 30 : 15) : -5;
    let pointsAdded = isCorrect ? 5 : 0;
    const dir = myTeam === "A" ? -1 : 1;

    runTransaction(gameRef, (data) => {
      if (!data || data.status !== "playing") return data;
      let pos = Math.max(-100, Math.min(100, (data.ropePosition || 0) + (pullForce * dir)));
      return { 
        ...data, 
        ropePosition: pos, 
        scoreRed: myTeam === "A" ? (data.scoreRed || 0) + pointsAdded : (data.scoreRed || 0),
        scoreBlue: myTeam === "B" ? (data.scoreBlue || 0) + pointsAdded : (data.scoreBlue || 0) 
      };
    });

    qIdx = (qIdx + 1) % QUESTIONS[myTeam].length;
    renderQ();
  };

  function renderQ() {
    if (!myTeam || currentStatus !== "playing") return;
    const q = QUESTIONS[myTeam][qIdx];
    document.getElementById("qText").innerText = q.q;
    document.getElementById("qOptions").innerHTML = q.options.map(opt => `<button class="opt" onclick="handleAnswer('${opt}', event)">${opt}</button>`).join('');
  }
</script>

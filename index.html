<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phase Changes: Tug-of-War Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      text-align: center; 
      padding: 20px; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #030712;
      transition: background 0.8s ease;
      position: relative;
      overflow: hidden;
    }

    /* SMOOTH LUXURY BACKGROUND GRADIENTS */
    body.theme-red { 
      background: linear-gradient(-45deg, #030712, #2a0813, #1e0b11, #090d16); 
      background-size: 300% 300%;
      animation: luxuryBG 15s ease infinite;
    }
    body.theme-blue { 
      background: linear-gradient(-45deg, #030712, #0b192e, #0c1527, #090d16); 
      background-size: 300% 300%;
      animation: luxuryBG 15s ease infinite;
    }

    @keyframes luxuryBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .timer-banner { 
      background: rgba(255, 255, 255, 0.05); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #f8fafc; 
      font-size: clamp(1rem, 3.5vw, 1.2rem); 
      font-weight: 700; 
      letter-spacing: 1px;
      padding: 10px 24px; 
      border-radius: 100px; 
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 24px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .timer-banner.sudden-death { background: rgba(243, 18, 96, 0.2); border-color: rgba(243, 18, 96, 0.4); color: #f31260; }

    /* CARD UI GLASSMORPHISM */
    .card { 
      background: rgba(15, 23, 42, 0.65); 
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: clamp(24px, 5vw, 40px); 
      border-radius: 28px; 
      width: 100%; 
      max-width: 440px; 
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5); 
      position: relative; 
    }

    .team-badge { 
      display: inline-flex; 
      align-items: center;
      gap: 8px;
      padding: 6px 16px; 
      border-radius: 100px; 
      font-weight: 800; 
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      margin-bottom: 20px; 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
    }
    .badge-red { background: rgba(243, 18, 96, 0.15); color: #f31260; border: 1px solid rgba(243, 18, 96, 0.3); }
    .badge-blue { background: rgba(0, 111, 238, 0.15); color: #006fee; border: 1px solid rgba(0, 111, 238, 0.3); }

    .question { font-size: clamp(1.2rem, 4vw, 1.4rem); font-weight: 700; margin-bottom: 25px; color: #f8fafc; line-height: 1.4; }
    
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button.opt { 
      width: 100%; 
      min-height: 60px;
      padding: 15px; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 16px; 
      background: rgba(255, 255, 255, 0.03); 
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(0.95rem, 3.5vw, 1.1rem); 
      font-weight: 600; 
      cursor: pointer; 
      color: #f1f5f9; 
      transition: all 0.2s ease; 
    }
    button.opt:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }
    button.opt:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.12); }

    /* FLOATING FX */
    .float-fx { position: absolute; font-weight: 800; font-size: 1.5rem; pointer-events: none; animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; z-index: 100; }
    .fx-plus { color: #17c964; }
    .fx-minus { color: #f31260; }
    @keyframes floatUp { 
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
    }

    .end-screen { 
      font-size: clamp(1.4rem, 4.5vw, 2rem); 
      font-weight: 800; 
      padding: 40px 20px; 
      border-radius: 28px; 
      display: none; 
      width: 100%; 
      max-width: 440px; 
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .win { color: #17c964; border-color: rgba(23, 201, 100, 0.4); }
    .lose { color: #f31260; border-color: rgba(243, 18, 96, 0.4); }
  </style>
</head>
<body>

  <div class="timer-banner" id="timerBanner">TIME: <span id="gameTimer">03:00</span></div>
  <div id="endScreen" class="end-screen"></div>

  <div class="card" id="gameCard">
    <div id="teamBadge" class="team-badge">Assigning...</div>
    <div class="question" id="qText">Loading question...</div>
    <div class="options" id="qOptions"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY",
      authDomain: "tug-of-war-game-f18b3.firebaseapp.com",
      databaseURL: "https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com",
      projectId: "tug-of-war-game-f18b3",
      storageBucket: "tug-of-war-game-f18b3.firebasestorage.app",
      messagingSenderId: "797664292032",
      appId: "1:797664292032:web:781e254da90da2c43e5125"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gameRef = ref(db, "game/state");

    const QUESTIONS = {
      A: [
        { q: "What is 8 × 7?", options: ["54", "56", "62", "48"], answer: "56" },
        { q: "Capital of Japan?", options: ["Seoul", "Beijing", "Tokyo", "Bangkok"], answer: "Tokyo" },
        { q: "Boiling point of water?", options: ["90°C", "100°C", "110°C", "120°C"], answer: "100°C" }
      ],
      B: [
        { q: "What is 9 × 6?", options: ["54", "45", "63", "52"], answer: "54" },
        { q: "Which planet is largest?", options: ["Mars", "Saturn", "Jupiter", "Earth"], answer: "Jupiter" },
        { q: "Primary color?", options: ["Green", "Blue", "Purple", "Orange"], answer: "Blue" }
      ]
    };

    let myTeam = null, qIdx = 0, isSuddenDeath = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    const presenceRef = ref(db, "game/presence");
    const myPlayerRef = ref(db, `game/presence/${Math.random().toString(36).substring(2, 9)}`);

    runTransaction(presenceRef, (data) => {
      let red = 0, blue = 0;
      if (data) Object.values(data).forEach(p => { if (p.team === "A") red++; else blue++; });
      myTeam = red <= blue ? "A" : "B";
      return data;
    }).then(() => {
      set(myPlayerRef, { team: myTeam });
      onDisconnect(myPlayerRef).remove();
      setupUI(); renderQ();
    });

    onValue(gameRef, (snapshot) => {
      const data = snapshot.val() || {};
      const t = data.timerSecs !== undefined ? data.timerSecs : 180;
      
      isSuddenDeath = t <= 30 && t > 0;
      const banner = document.getElementById("timerBanner");
      if (isSuddenDeath) {
        banner.className = "timer-banner sudden-death";
        banner.innerHTML = `⚡ 2X PULL FORCE! <span id="gameTimer">${t}s</span>`;
      } else {
        banner.className = "timer-banner";
        const m = Math.floor(t / 60).toString().padStart(2, '0');
        const s = (t % 60).toString().padStart(2, '0');
        banner.innerHTML = `TIME: <span id="gameTimer">${m}:${s}</span>`;
      }

      if (data.gameOver) {
        document.getElementById("gameCard").style.display = "none";
        const endScreen = document.getElementById("endScreen");
        endScreen.style.display = "block";

        if (data.winner === myTeam) {
          endScreen.className = "end-screen win";
          endScreen.innerHTML = "VICTORY<br><span style='font-size: 1rem; opacity: 0.8;'>YOUR TEAM WON</span>";
          playBeep(523, "sine", 0.5);
        } else if (data.winner === "TIE") {
          endScreen.className = "end-screen";
          endScreen.innerHTML = "DRAW GAME";
        } else {
          endScreen.className = "end-screen lose";
          endScreen.innerHTML = "DEFEAT<br><span style='font-size: 1rem; opacity: 0.8;'>YOUR TEAM LOST</span>";
          playBeep(150, "sawtooth", 0.5);
        }
      } else {
        document.getElementById("gameCard").style.display = "block";
        document.getElementById("endScreen").style.display = "none";
      }
    });

    window.handleAnswer = function(selected, evt) {
      const isCorrect = selected === QUESTIONS[myTeam][qIdx].answer;
      showFloatFX(evt.clientX, evt.clientY, isCorrect ? "+5 PTS" : "-5 PULL", isCorrect);

      if (isCorrect) playBeep(587.33, "sine", 0.2);
      else playBeep(130.81, "square", 0.3);

      let pullForce = isCorrect ? (isSuddenDeath ? 30 : 15) : -5;
      let pointsAdded = isCorrect ? 5 : 0;
      const dir = myTeam === "A" ? -1 : 1;

      runTransaction(gameRef, (data) => {
        if (!data || data.gameOver) return data;
        let pos = Math.max(-100, Math.min(100, (data.ropePosition || 0) + (pullForce * dir)));
        return {
          ...data,
          ropePosition: pos,
          scoreRed: myTeam === "A" ? (data.scoreRed || 0) + pointsAdded : (data.scoreRed || 0),
          scoreBlue: myTeam === "B" ? (data.scoreBlue || 0) + pointsAdded : (data.scoreBlue || 0)
        };
      });

      qIdx = (qIdx + 1) % QUESTIONS[myTeam].length;
      renderQ();
    };

    function showFloatFX(x, y, text, isPlus) {
      const el = document.createElement("div");
      el.className = `float-fx ${isPlus ? 'fx-plus' : 'fx-minus'}`;
      el.innerText = text;
      el.style.left = `${x - 30}px`;
      el.style.top = `${y - 20}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function renderQ() {
      if (!myTeam) return;
      const q = QUESTIONS[myTeam][qIdx];
      document.getElementById("qText").innerText = q.q;
      document.getElementById("qOptions").innerHTML = q.options.map(opt => `
        <button class="opt" onclick="handleAnswer('${opt}', event)">${opt}</button>
      `).join('');
    }

    function setupUI() {
      const card = document.getElementById("gameCard");
      const badge = document.getElementById("teamBadge");
      const body = document.body;

      if (myTeam === "A") {
        body.className = "theme-red";
        badge.className = "team-badge badge-red";
        badge.innerHTML = "Team Red";
      } else {
        body.className = "theme-blue";
        badge.className = "team-badge badge-blue";
        badge.innerHTML = "Team Blue";
      }
    }
  </script>
</body>
</html>

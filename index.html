<body>
  <div class="countdown-overlay" id="cdOverlay"><div class="cd-label">GET READY</div><div class="cd-number" id="cdNum">3</div></div>
  <div class="result-overlay" id="resultOverlay"><div class="result-card"><div class="result-icon" id="resIcon">🏆</div><div class="result-title" id="resTitle">VICTORY!</div><div class="result-subtitle" id="resSubtitle">Your team pulled through to take the win!</div></div></div>
  <div class="card-wrapper">
    <div class="card" id="joinCard"><h1>JOIN THE MATCH</h1><input type="text" id="playerName" placeholder="Enter Your Name"><button class="btn join-btn" style="width: 100%; margin-top: 6px;" onclick="joinGame()">JOIN MATCH</button></div>
    <div class="card" id="gameCard" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><span id="playerBadge" style="font-weight: 700; opacity: 0.9;"></span><span id="statusBadge" style="font-weight: 800; color: #facc15;">WAITING...</span></div>
      <div class="cooldown-banner" id="cooldownBanner"><div id="cooldownText">⚠️ SLIPPED! REGAINING FOOTING (4.0s)...</div><div class="cooldown-bar-bg"><div class="cooldown-bar-fill" id="cooldownBar"></div></div></div>
      <div class="q-box" id="qText">Get Ready!</div>
      <div class="options-grid" id="optionsGrid"><button class="opt" disabled>A</button><button class="opt" disabled>B</button><button class="opt" disabled>C</button><button class="opt" disabled>D</button></div>
    </div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    const app=initializeApp({apiKey:"AIzaSyCS3yT10PtrUfFqvO4MhsZucgEatbSFKZY",authDomain:"tug-of-war-game-f18b3.firebaseapp.com",databaseURL:"https://tug-of-war-game-f18b3-default-rtdb.firebaseio.com",projectId:"tug-of-war-game-f18b3"});
    const db=getDatabase(app),gameRef=ref(db,"game/state"),presenceRef=ref(db,"game/presence"),pullsRef=ref(db,"game/pulls");
    const RAW_QUESTIONS=[
      {q:"What subatomic particle defines the fundamental chemical identity of an element?",opts:["Neutron","Proton","Electron","Positron"],answer:"Proton"},
      {q:"Atoms of the exact same element that have different numbers of neutrons are called:",opts:["Isobars","Isotopes","Isotones","Isomers"],answer:"Isotopes"},
      {q:"In two different isotopes of the same element, which subatomic particle counts are identical?",opts:["Neutrons and mass numbers","Protons and electrons","Protons and neutrons","Neutrons and electrons"],answer:"Protons and electrons"},
      {q:"What changes when a neutral atom gains or loses neutrons to become a different isotope?",opts:["Its electrical charge","Its element symbol","Its mass number","Its atomic number"],answer:"Its mass number"},
      {q:"Isotopes have identical chemical properties because they have the exact same number of:",opts:["Neutrons","Electrons","Mass numbers","Nuclear charges"],answer:"Electrons"},
      {q:"Sets of elements that have the same number of neutrons are called:",opts:["Isotopes","Isotones","Isobars","Isomers"],answer:"Isotones"},
      {q:"Sets of elements that share the exact same mass number (A) are called:",opts:["Isobars","Isotones","Isotopes","Radioisotopes"],answer:"Isobars"},
      {q:"Which physical property is slightly different between different isotopes of the same element?",opts:["Reactivity with oxygen","Chemical bonding ratio","Density and boiling point","Electrical conductivity"],answer:"Density and boiling point"},
      {q:"What do we call unstable, artificial isotopes that release radiation as they decay?",opts:["Stable nuclides","Radioisotopes","Isobars","Heavy elements"],answer:"Radioisotopes"},
      {q:"How are artificial radioisotopes usually created in a laboratory or nuclear core?",opts:["By stripping off all electrons","By bombarding stable nuclei with energetic neutrons","By freezing elements to absolute zero","By heating elements with laser radiation"],answer:"By bombarding stable nuclei with energetic neutrons"},
      {q:"Which radioisotope is commonly found inside household smoke detectors?",opts:["Americium-241","Carbon-14","Iodine-131","Uranium-238"],answer:"Americium-241"},
      {q:"Carbon-14 (¹⁴C) is widely used in archaeology and geology for:",opts:["Detecting hidden explosives","Treating thyroid cancer","Estimating the age of organic artifacts","Measuring water salinity"],answer:"Estimating the age of organic artifacts"},
      {q:"Which radioisotope is used in medicine to detect and treat thyroid diseases?",opts:["Californium-252","Iodine-131","Americium-241","Cobalt-59"],answer:"Iodine-131"},
      {q:"What radioisotope do geologists use to determine the age of ancient rocks?",opts:["Carbon-14","Uranium-238","Iodine-131","Americium-241"],answer:"Uranium-238"},
      {q:"Which radioisotope is utilized in security and military operations to detect hidden explosives?",opts:["Chlorine-35","Hydrogen-3","Californium-252","Uranium-238"],answer:"Californium-252"},
      {q:"How many naturally occurring isotopes does Hydrogen have?",opts:["1","2","3","4"],answer:"3"},
      {q:"What is the special name given to the Hydrogen-2 (²₁H) isotope?",opts:["Protium","Deuterium","Tritium","Hydronium"],answer:"Deuterium"},
      {q:"Which of the following elements has NO naturally occurring isotopes?",opts:["Hydrogen","Chlorine","Sodium","Oxygen"],answer:"Sodium"},
      {q:"Oxygen-16 and Oxygen-18 ratios in Antarctic ice cores are used by climate scientists to study:",opts:["Historical global temperatures and glacial periods","Ocean volcanic eruptions","Atmospheric pressure changes","Cosmic ray levels"],answer:"Historical global temperatures and glacial periods"},
      {q:"When cobalt-59 is bombarded with a neutron in a nuclear reactor, what product isotope is formed?",opts:["Cobalt-58","Cobalt-60","Nickel-59","Iron-59"],answer:"Cobalt-60"},
      {q:"In standard nuclear notation ᴬẕX, what does the top number (A) represent?",opts:["Atomic Number","Mass Number","Number of Electrons","Net Charge"],answer:"Mass Number"},
      {q:"In standard nuclear notation ᴬẕX, how do you calculate the number of neutrons (n⁰)?",opts:["Z + A","A - Z","Z - A","A × Z"],answer:"A - Z"},
      {q:"How many protons and neutrons are in a Hydrogen-1 (¹₁H) atom?",opts:["1 proton, 0 neutrons","1 proton, 1 neutron","0 protons, 1 neutron","1 proton, 2 neutrons"],answer:"1 proton, 0 neutrons"},
      {q:"How many neutrons are present in Hydrogen-3 (³₁H, Tritium)?",opts:["1","2","3","0"],answer:"2"},
      {q:"Chlorine-35 (³⁵₁₇Cl) has an atomic number of 17. How many neutrons does it have?",opts:["17","18","35","52"],answer:"18"},
      {q:"Chlorine-37 (³⁷₁₇Cl) has how many neutrons?",opts:["17","18","20","37"],answer:"20"},
      {q:"An atom has 6 protons, 6 electrons, and 8 neutrons. What is its mass number (A)?",opts:["6","12","14","20"],answer:"14"},
      {q:"An atom has 19 protons and 20 neutrons. What is its standard nuclear representation?",opts:["²⁰₁₉K","³⁹₁₉K","³⁹₂₀K","¹⁹₃₉K"],answer:"³⁹₁₉K"},
      {q:"What is the number of neutrons in an Argon-38 (³⁸₁₈Ar) atom?",opts:["18","20","38","56"],answer:"20"},
      {q:"Sulfur-40 (⁴⁰₁₆S) contains how many neutrons?",opts:["16","20","24","40"],answer:"24"},
      {q:"Consider the pair: ³⁵₁₇Cl and ³⁷₁₇Cl. These two nuclides are best classified as:",opts:["Isotopes","Isotones","Isobars","Radioelements"],answer:"Isotopes"},
      {q:"Consider the pair: ³⁸₁₈Ar (n⁰ = 20) and ³⁹₁₉K (n⁰ = 20). These two nuclides are best classified as:",opts:["Isotopes","Isotones","Isobars","Allotropes"],answer:"Isotones"},
      {q:"Consider the pair: ⁴⁰₁₆S and ⁴⁰₂₀Ca. Since both have a mass number of 40, they are classified as:",opts:["Isotopes","Isotones","Isobars","Isomers"],answer:"Isobars"},
      {q:"Which pair among the following represents a set of ISOTOPES?",opts:["³⁸₁₈Ar and ³⁹₁₉K","¹²₆C and ¹⁴₆C","⁴⁰₁₆S and ⁴⁰₂₀Ca","¹⁴₆C and ¹⁶₈O"],answer:"¹²₆C and ¹⁴₆C"},
      {q:"Which pair among the following represents a set of ISOTONES?",opts:["¹₁H and ²₁H","⁴⁰₁₆S and ⁴⁰₁₉K","¹⁴₆C (n=8) and ¹⁶₈O (n=8)","³⁵₁₇Cl and ³⁷₁₇Cl"],answer:"¹⁴₆C (n=8) and ¹⁶₈O (n=8)"}
    ];
    const QUESTIONS={A:RAW_QUESTIONS,B:RAW_QUESTIONS};
    let myName="",myTeam="",qIdx=0,currentStatus="waiting",isSuddenDeath=false,isCoolingDown=false,wrongAnswerCount=0,lastCdVal=null,resultOverlayShown=false;
    const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    function playBeep(freq,type,duration){if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.value=freq;osc.connect(gain);gain.connect(audioCtx.destination);osc.start();gain.gain.exponentialRampToValueAtTime(0.00001,audioCtx.currentTime+duration);osc.stop(audioCtx.currentTime+duration)}
    function playVictorySound(){if(audioCtx.state==='suspended')audioCtx.resume();[523.25,659.25,783.99,1046.50].forEach((freq,idx)=>setTimeout(()=>playBeep(freq,"triangle",0.3),idx*120))}
    function playDefeatSound(){if(audioCtx.state==='suspended')audioCtx.resume();[400,350,300,220].forEach((freq,idx)=>setTimeout(()=>playBeep(freq,"sawtooth",0.35),idx*150))}
    window.joinGame=function(){
      const nameInput=document.getElementById("playerName").value.trim();if(!nameInput)return alert("Please enter your name!");myName=nameInput;
      const uniqueId=`${myName}_${Date.now()}`;
      onValue(presenceRef,(snapshot)=>{
        const players=snapshot.val()||{};let redCount=0,blueCount=0;
        Object.values(players).forEach(p=>{if(p.team==="A")redCount++;else if(p.team==="B")blueCount++});
        if(redCount<blueCount)myTeam="A";else if(blueCount<redCount)myTeam="B";else myTeam=Math.random()<0.5?"A":"B";
        const playerRef=ref(db,`game/presence/${uniqueId}`);set(playerRef,{name:myName,team:myTeam});onDisconnect(playerRef).remove();
        document.body.className=myTeam==='A'?'team-red':'team-blue';
        document.getElementById("joinCard").style.display="none";document.getElementById("gameCard").style.display="flex";
        const badge=document.getElementById("playerBadge");badge.innerText=`${myName} (${myTeam==='A'?'RED TEAM':'BLUE TEAM'})`;badge.style.color=myTeam==='A'?'#ff8593':'#7dd3fc';listenToGame();
      },{onlyOnce:true});
    };
    function listenToGame(){onValue(gameRef,(snapshot)=>{
      const data=snapshot.val()||{};currentStatus=data.status||"waiting";isSuddenDeath=(data.timerSecs!==undefined&&data.timerSecs<=30&&data.timerSecs>0);
      const statusBadge=document.getElementById("statusBadge"),cdOverlay=document.getElementById("cdOverlay"),cdNum=document.getElementById("cdNum"),resultOverlay=document.getElementById("resultOverlay");
      if(currentStatus==="countdown"){resultOverlayShown=false;resultOverlay.style.display="none";resultOverlay.className="result-overlay";wrongAnswerCount=0;const cdVal=data.countdownVal!==undefined?data.countdownVal:"3";cdOverlay.style.display="flex";cdNum.innerText=cdVal;if(cdVal!==lastCdVal){playBeep(cdVal==="GO!"?880:440,"triangle",0.25);lastCdVal=cdVal}statusBadge.innerText="READY...";statusBadge.style.color="#facc15";document.getElementById("qText").innerText="Get Ready!";disableButtons(true)}
      else{cdOverlay.style.display="none";lastCdVal=null;if(currentStatus==="playing"){resultOverlayShown=false;resultOverlay.style.display="none";resultOverlay.className="result-overlay";statusBadge.innerText=isSuddenDeath?"🔥 SUDDEN DEATH 2X!":"PULL!";statusBadge.style.color=isSuddenDeath?"#ff2a5f":"#4ade80";if(!isCoolingDown)renderQ()}
      else if(currentStatus==="ended"){statusBadge.innerText="MATCH OVER";statusBadge.style.color="#ef4444";disableButtons(true);if(!resultOverlayShown){resultOverlayShown=true;const resIcon=document.getElementById("resIcon"),resTitle=document.getElementById("resTitle"),resSubtitle=document.getElementById("resSubtitle");if(data.winner===myTeam){resultOverlay.className="result-overlay win";resIcon.innerText="🏆";resTitle.innerText="VICTORY!";resSubtitle.innerText="Your team pulled with relentless force and dominated the match!";playVictorySound()}else if(data.winner==="TIE"){resultOverlay.className="result-overlay tie";resIcon.innerText="🤝";resTitle.innerText="DRAW!";resSubtitle.innerText="An evenly matched battle! Both teams stood their ground.";playBeep(440,"sine",0.4)}else{resultOverlay.className="result-overlay lose";resIcon.innerText="💔";resTitle.innerText="DEFEAT";resSubtitle.innerText="The opposition dragged your team across the line. Better luck next time!";playDefeatSound()}resultOverlay.style.display="flex"}}
      else{resultOverlayShown=false;resultOverlay.style.display="none";resultOverlay.className="result-overlay";statusBadge.innerText="WAITING FOR HOST...";statusBadge.style.color="#facc15";document.getElementById("qText").innerText="Waiting for host to start...";disableButtons(true)}}},);
    }
    function renderQ(){if(currentStatus!=="playing"||isCoolingDown)return;const q=QUESTIONS[myTeam][qIdx],grid=document.getElementById("optionsGrid");document.getElementById("qText").innerText=q.q;grid.innerHTML="";q.opts.forEach(opt=>{const btn=document.createElement("button");btn.className="opt";btn.innerText=opt;btn.onclick=e=>handleAnswer(opt,e);grid.appendChild(btn)})}
    function disableButtons(disabled){document.querySelectorAll("button.opt").forEach(b=>b.disabled=disabled)}
    window.handleAnswer=function(selected,evt){if(currentStatus!=="playing"||isCoolingDown)return;const isCorrect=selected===QUESTIONS[myTeam][qIdx].answer;const el=document.createElement("div");el.className=`float-fx ${isCorrect?'fx-plus':'fx-minus'}`;el.innerText=isCorrect?"+5 PTS":"SLIPPED!";el.style.left=`${evt.clientX-25}px`;el.style.top=`${evt.clientY-15}px`;document.body.appendChild(el);setTimeout(()=>el.remove(),800);
      if(isCorrect){playBeep(587.33,"sine",0.2);let pullForce=isSuddenDeath?15:7.5,pointsAdded=5;push(pullsRef,{team:myTeam,force:pullForce,points:pointsAdded,timestamp:Date.now()});qIdx=(qIdx+1)%QUESTIONS[myTeam].length;renderQ()}
      else{wrongAnswerCount++;playBeep(130.81,"square",0.3);triggerCooldown(4)}
    };
    function triggerCooldown(seconds){isCoolingDown=true;const banner=document.getElementById("cooldownBanner"),text=document.getElementById("cooldownText"),bar=document.getElementById("cooldownBar");disableButtons(true);banner.style.display="flex";bar.style.width="100%";const startTime=Date.now(),durationMs=seconds*1000;const timer=setInterval(()=>{const elapsed=Date.now()-startTime,remainingMs=Math.max(0,durationMs-elapsed),percentLeft=remainingMs/durationMs*100;bar.style.width=`${percentLeft}%`;text.innerText=`⚠️ SLIPPED! REGAINING FOOTING (${(remainingMs/1000).toFixed(1)}s)...`;if(remainingMs<=0){clearInterval(timer);isCoolingDown=false;banner.style.display="none";if(currentStatus==="playing"){qIdx=(qIdx+1)%QUESTIONS[myTeam].length;renderQ()}}},50)}
  </script>
